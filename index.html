<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tarefas e horas de trabalho por cliente: cronômetro, quadros de tarefas, folha de horas da semana e relatórios com valores em cada moeda.">
<meta name="theme-color" content="#5b3fd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expediente">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<title>Expediente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: celular primeiro. Barra inferior com 5 abas (lateral no computador); barra do cronômetro ativo
   sempre visível no topo do conteúdo; quadros com colunas roláveis; folha de horas em grade com a 1ª coluna fixa. */
:root {
  --bg: #f4f3f8; --surface: #ffffff; --surface-2: #eeedf4; --ink: #18161f; --ink-2: #4a4659; --muted: #767189;
  --line: #e2e0ea; --line-2: #cbc8d8;
  --accent: #5b3fd6; --accent-2: #ece8fd; --accent-ink: #ffffff;
  --ok: #157347; --ok-bg: #e0f2e7; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b42318; --bad-bg: #fde4e1; --neutro-bg: #eceaf2;
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #c98500; --c4: #d55181; --c5: #008300; --c6: #4a3aa7; --c7: #e34948;
  --sombra: 0 1px 2px rgb(24 22 31 / 6%), 0 6px 20px rgb(24 22 31 / 6%); --veu: rgb(24 22 31 / 45%);
  --f-titulo: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --f-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 14px; --r-sm: 10px; --toque: 44px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111017; --surface: #19171f; --surface-2: #211f29; --ink: #eeecf4; --ink-2: #b6b2c6; --muted: #8a8599;
    --line: #2a2733; --line-2: #3a3645;
    --accent: #9d8cff; --accent-2: #2a2445; --accent-ink: #120d29;
    --ok: #4cc386; --ok-bg: #13301f; --warn: #f0b64b; --warn-bg: #392b0f; --bad: #ff8d80; --bad-bg: #431a1a; --neutro-bg: #25222e;
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181; --c5: #2a9d2a; --c6: #9085e9; --c7: #e66767;
    --sombra: 0 1px 0 rgb(0 0 0 / 35%); --veu: rgb(0 0 0 / 60%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111017; --surface: #19171f; --surface-2: #211f29; --ink: #eeecf4; --ink-2: #b6b2c6; --muted: #8a8599;
  --line: #2a2733; --line-2: #3a3645;
  --accent: #9d8cff; --accent-2: #2a2445; --accent-ink: #120d29;
  --ok: #4cc386; --ok-bg: #13301f; --warn: #f0b64b; --warn-bg: #392b0f; --bad: #ff8d80; --bad-bg: #431a1a; --neutro-bg: #25222e;
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181; --c5: #2a9d2a; --c6: #9085e9; --c7: #e66767;
  --sombra: 0 1px 0 rgb(0 0 0 / 35%); --veu: rgb(0 0 0 / 60%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-ui); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mudo { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.marca { display: flex; align-items: center; gap: 10px; padding: 2px 10px 18px; }
.marca-selo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.marca-selo svg { width: 20px; height: 20px; }
.marca b { font-family: var(--f-titulo); font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: var(--toque); padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--ink-2); font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-2); color: var(--accent); }
.lateral .rodape { margin-top: auto; padding: 12px 4px 0; }
.principal { min-width: 0; padding-inline: 28px; padding-block: 0 56px; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding-block: 14px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 1180px; margin-inline: auto; }
.topo h1 { font-family: var(--f-titulo); font-size: 26px; font-weight: 800; }
.topo .dir { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
main { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; cursor: default; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync.sincronizando i { background: var(--warn); animation: pulsar 1s ease-in-out infinite; }
.sync.offline i { background: var(--muted); }
.sync.erro { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); cursor: pointer; }
.sync.erro i { background: var(--bad); }
@keyframes pulsar { 50% { opacity: .35; } }
.seletor-area { min-height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 14px; font-weight: 700; max-width: 220px; }
.inferior { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { display: none; }
  .principal { padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  .topo h1 { font-size: 22px; }
  .inferior { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 2px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .inferior button { flex: 1; min-width: 0; min-height: 56px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .inferior button svg { width: 23px; height: 23px; }
  .inferior button[aria-current="page"] { color: var(--accent); }
}
body.fora .lateral, body.fora .inferior, body.fora .topo { display: none; }
body.fora .app { grid-template-columns: minmax(0, 1fr); }

/* ---------- barra do cronômetro ativo ---------- */
.ativo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 19; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 10px 12px 10px 16px; box-shadow: var(--sombra); }
.ativo .ponto { width: 10px; height: 10px; border-radius: 50%; background: #ff5d5d; flex: none; animation: pulsar 1.4s ease-in-out infinite; }
.ativo.pausado .ponto { background: var(--warn); animation: none; }
.ativo .tempo { font-family: var(--f-num); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; flex: none; }
.ativo .info { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.ativo .info strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; }
.ativo .info small { opacity: .75; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ativo button { min-height: 42px; min-width: 42px; border-radius: 11px; border: 1px solid color-mix(in srgb, var(--bg) 28%, transparent); background: transparent; color: inherit; font-weight: 800; cursor: pointer; padding: 0 12px; display: inline-grid; place-items: center; }
.ativo button svg { width: 20px; height: 20px; }
.ativo button.forte { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 860px) { .ativo { top: calc(env(safe-area-inset-top, 0px) + 56px); gap: 9px; padding: 8px 8px 8px 12px; } .ativo .tempo { font-size: 19px; } }

/* ---------- blocos ---------- */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.cartao-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.cartao-cab h2 { font-size: 17px; font-weight: 800; }
.cartao-cab small { color: var(--muted); font-size: 13px; }
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .grade-2 { grid-template-columns: minmax(0, 1fr); } }
.rotulo-mini { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.aviso { padding: 11px 13px; border-radius: var(--r-sm); background: var(--accent-2); color: var(--ink); font-size: 14px; }
.aviso.neutro { background: var(--surface-2); color: var(--ink-2); }
.aviso.atencao { background: var(--warn-bg); color: var(--warn); }
.aviso.perigo { background: var(--bad-bg); color: var(--bad); }
.vazio { text-align: center; padding: 22px 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vazio strong { color: var(--ink); font-size: 15.5px; }
.sep { height: 1px; background: var(--line); margin: 6px 0; }
.ponto-cor { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- botões e campos ---------- */
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: var(--toque); padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.botao:hover { background: var(--surface-2); }
.botao svg { width: 18px; height: 18px; }
.botao.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.botao.primario:hover { filter: brightness(1.06); }
.botao.perigo { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-2)); }
.botao.perigo.cheio { background: var(--bad); color: #fff; border-color: var(--bad); }
.botao.fantasma { border-color: transparent; background: none; color: var(--accent); padding-inline: 10px; }
.botao.fantasma:hover { background: var(--accent-2); }
.botao.peq { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.botao.grande { min-height: 54px; font-size: 16.5px; padding: 0 22px; }
.botao.largo { width: 100%; }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.linha-botoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.campos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.campos .largo { grid-column: 1 / -1; }
@media (max-width: 520px) { .campos.tres { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo > span, fieldset.campo > legend { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 0; }
fieldset.campo { border: 0; margin: 0; padding: 0; }
.campo input, .campo select, .campo textarea, .entrada { min-height: var(--toque); padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); width: 100%; min-width: 0; font-size: 16px; }
.campo textarea { padding: 10px 12px; min-height: 90px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus, .entrada:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.campo .dica { font-size: 12.5px; color: var(--muted); }
.erro-campo { color: var(--bad); font-size: 14px; font-weight: 700; }
.erro-campo:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip > span { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-2); color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); }
.chip-botao { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); cursor: pointer; max-width: 100%; }
.chip-botao span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-botao svg { width: 14px; height: 14px; flex: none; }
.chip-botao[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-2); color: var(--ink); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: var(--toque); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: var(--neutro-bg); color: var(--ink-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.acento { background: var(--accent-2); color: var(--accent); }
.barra { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); max-width: 100%; }

/* ---------- cronômetro ---------- */
.iniciar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.iniciar .descricao { grid-column: 1 / -1; }
.iniciar .acoes { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) { .iniciar { grid-template-columns: minmax(0, 1fr); } }
.relogio { font-family: var(--f-num); font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
.dia-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 2px 6px; }
.dia-cab strong { font-size: 14.5px; }
.dia-cab .num { font-weight: 700; }
.registro { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--line); min-height: 58px; }
.registro .cor { align-self: stretch; border-radius: 4px; }
.registro .txt { min-width: 0; cursor: pointer; }
.registro .txt strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.registro .txt small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.registro .dur { font-family: var(--f-num); font-weight: 700; text-align: right; white-space: nowrap; }
.registro .dur small { display: block; font-family: var(--f-ui); font-weight: 600; font-size: 11.5px; color: var(--muted); }
.icone-botao { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.icone-botao:hover { background: var(--surface-2); color: var(--ink); }
.icone-botao svg { width: 20px; height: 20px; }
.recentes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.recentes .chip-botao { flex: none; max-width: 240px; }

/* ---------- quadros ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
@media (max-width: 640px) { .kanban { grid-auto-columns: 86%; } }
.coluna { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; scroll-snap-align: start; }
.coluna.alvo { outline: 2px dashed var(--accent); outline-offset: -2px; }
.coluna-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px; }
.coluna-cab strong { font-size: 14.5px; }
.cartao-tarefa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; box-shadow: var(--sombra); }
.cartao-tarefa[draggable="true"] { cursor: grab; }
.cartao-tarefa.arrastando { opacity: .4; }
.cartao-tarefa .titulo { font-weight: 700; font-size: 14.5px; }
.cartao-tarefa .rodape-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.cartao-tarefa .rodape-t .play { margin-left: auto; }
.nova-tarefa { display: flex; gap: 6px; }
.nova-tarefa input { flex: 1; min-width: 0; min-height: 40px; border: 1px dashed var(--line-2); background: transparent; border-radius: 10px; padding: 0 10px; font-size: 14.5px; }
.prio { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.prio.baixa { background: var(--muted); } .prio.media { background: var(--c0); } .prio.alta { background: var(--c3); } .prio.urgente { background: var(--bad); }
.etiqueta { padding: 1px 8px; border-radius: 999px; background: var(--accent-2); color: var(--accent); font-weight: 700; font-size: 11.5px; }
.lista-tarefas .linha-t { display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px 80px 44px; gap: 10px; align-items: center; padding: 9px 4px; border-top: 1px solid var(--line); cursor: pointer; }
@media (max-width: 640px) { .lista-tarefas .linha-t { grid-template-columns: minmax(0, 1fr) auto 44px; } .lista-tarefas .so-pc { display: none; } }
.check-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) 36px; gap: 8px; align-items: center; min-height: 40px; }
.check-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.check-item.feito span { text-decoration: line-through; color: var(--muted); }

/* ---------- folha de horas ---------- */
.folha-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.folha { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
table.folha th, table.folha td { border-bottom: 1px solid var(--line); padding: 6px; text-align: center; }
table.folha th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 800; padding-block: 10px; }
table.folha th.hoje { color: var(--accent); }
table.folha .rot { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 190px; max-width: 240px; padding-left: 12px; }
table.folha .rot strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.folha .rot small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.folha input { width: 72px; min-height: 40px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); text-align: center; font-family: var(--f-num); font-size: 15px; font-weight: 700; }
table.folha input:focus { outline: 2px solid var(--accent); background: var(--surface); }
table.folha input.trava { background: transparent; border-color: var(--line); cursor: pointer; }
table.folha tfoot td { font-family: var(--f-num); font-weight: 700; }
table.folha .total { font-family: var(--f-num); font-weight: 700; }

/* ---------- relatórios ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .valor { font-family: var(--f-num); font-size: 22px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .det { font-size: 12.5px; color: var(--muted); }
.grafico { width: 100%; position: relative; }
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico text { font-family: var(--f-ui); font-size: 11.5px; fill: var(--muted); }
.tabela-wrap { overflow-x: auto; }
table.dados { width: 100%; border-collapse: collapse; font-size: 14px; }
table.dados th, table.dados td { padding: 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.dados th:first-child, table.dados td:first-child { text-align: left; white-space: normal; }
table.dados th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.dados td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.dados tr.nivel-1 td:first-child { padding-left: 22px; }
table.dados tr.nivel-2 td:first-child { padding-left: 40px; color: var(--ink-2); }
table.dados tr.nivel-0 td { font-weight: 700; }
/* dias trabalhados: um bloco por dia (data e horas) com o detalhe por cliente/quadro/tarefa embaixo */
table.dados.dias tbody td { border-bottom: 0; padding-block: 3px; }
table.dados.dias tbody { border-bottom: 1px solid var(--line); }
table.dados.dias tbody tr:first-child td { padding-top: 9px; font-weight: 700; }
table.dados.dias tbody tr:last-child td { padding-bottom: 9px; }
table.dados.dias tr.sub td { color: var(--ink-2); font-size: 13.5px; }
table.dados.dias tr.sub td:first-child { padding-left: 22px; }
table.dados.dias tfoot td { padding-top: 10px; font-weight: 800; font-size: 15px; border-bottom: 0; }
table.dados.dias .semana { color: var(--muted); font-weight: 500; margin-left: 6px; }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; white-space: pre-line; max-width: 240px; }

/* ---------- listas, áreas ---------- */
.linha-lista { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 52px; min-width: 0; }
.linha-lista:first-child { border-top: 0; }
.linha-lista .esq { min-width: 0; display: flex; align-items: center; gap: 10px; }
.linha-lista .esq > div { min-width: 0; }
.linha-lista strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-lista small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-lista .dir { display: flex; align-items: center; gap: 8px; flex: none; }
.clicavel { cursor: pointer; border-radius: 8px; }
.clicavel:hover { background: var(--surface-2); }
.cores { display: flex; gap: 8px; flex-wrap: wrap; }
.cores label { position: relative; }
.cores input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.cores span { display: block; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.cores input:checked + span { box-shadow: 0 0 0 2px var(--ink); }
.cores input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: var(--r); padding: 12px 14px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.banner.perigo { background: var(--bad-bg); color: var(--bad); }
.banner strong { display: block; }

/* ---------- modal, avisos, telas ---------- */
.veu { position: fixed; inset: 0; z-index: 60; background: var(--veu); display: flex; align-items: center; justify-content: center; padding: 24px 16px; animation: aparecer .14s ease-out; }
.modal { background: var(--surface); border-radius: 18px; width: min(580px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgb(0 0 0 / 28%); animation: subir .18s ease-out; }
.modal.largo { width: min(780px, 100%); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
.modal-cab h2 { font-size: 19px; font-weight: 800; }
.fechar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.fechar svg { width: 18px; height: 18px; }
.modal-corpo { padding: 8px 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-rodape { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.modal-rodape .dir { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
@media (max-width: 620px) { .veu { align-items: flex-end; padding: 0; } .modal, .modal.largo { width: 100%; border-radius: 20px 20px 0 0; max-height: 94vh; } }
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { transform: translateY(16px); opacity: 0; } }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / 25%); animation: subir .18s ease-out; }
.toast.erro { background: var(--bad); color: #fff; }
.toast button { margin-left: auto; border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; min-height: 36px; }
@media (max-width: 860px) { #toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }
.tela-centro { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px 0; }
.tela-centro > div { max-width: 460px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.tela-centro h2 { font-size: 21px; font-weight: 800; }
.carregando { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.tela-login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }
.cartao-login { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--sombra); }
.cartao-login h2 { font-family: var(--f-titulo); font-size: 28px; font-weight: 800; line-height: 1.1; }
.cartao-login p { color: var(--ink-2); }
.cartao-login .letra-miuda { font-size: 12.5px; color: var(--muted); }
.botao.entrar { min-height: 52px; font-size: 16px; gap: 10px; }
.primeira { max-width: 640px; margin: 24px auto; display: flex; flex-direction: column; gap: 16px; }
.primeira h2 { font-family: var(--f-titulo); font-size: 26px; font-weight: 800; }
.usuario { display: flex; align-items: center; gap: 10px; min-width: 0; }
.usuario .avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font-weight: 800; flex: none; }
.usuario .avatar img { width: 100%; height: 100%; object-fit: cover; }
.usuario .quem { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.usuario .quem strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario .quem small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<div class="app">
  <aside class="lateral" aria-label="Navegação">
    <div class="marca"><div class="marca-selo" id="marca-selo"></div><b>Expediente</b></div>
    <nav id="nav-lateral" style="display:flex;flex-direction:column;gap:2px"></nav>
    <div class="rodape" id="rodape-lateral"></div>
  </aside>
  <div class="principal">
    <header class="topo">
      <h1 id="titulo-aba">Cronômetro</h1>
      <div class="dir">
        <select class="seletor-area" id="seletor-area" aria-label="Área de trabalho"></select>
        <span class="sync" id="sync" role="status" aria-live="polite"><i></i><span>Salvo</span></span>
      </div>
    </header>

  </div>
</div>

<div id="tip" class="tip" hidden></div>
<script>/* Núcleo do Expediente: funções puras (sem DOM e sem banco), testadas no Node.
   Datas "AAAA-MM-DD"; horários em ISO UTC + fuso IANA do registro; durações em segundos;
   dinheiro em unidades menores da moeda (centavos; JPY/CLP sem casas). */
(function (raiz) {
  'use strict';
  const N = {};

  // ---------- datas simples ----------
  const pad = (n) => String(n).padStart(2, '0');
  N.isoDe = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  N.hoje = () => N.isoDe(new Date());
  N.dataValida = (iso) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return false; const [a, m, d] = iso.split('-').map(Number); return N.isoDe(new Date(a, m - 1, d)) === iso; };
  N.addDias = (iso, n) => { const [a, m, d] = iso.split('-').map(Number); return N.isoDe(new Date(a, m - 1, d + n)); };
  N.difDias = (a, b) => { const p = (s) => { const [x, y, z] = s.split('-').map(Number); return Date.UTC(x, y - 1, z); }; return Math.round((p(b) - p(a)) / 86400000); };
  N.diaSemana = (iso) => { const [a, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d)).getUTCDay(); };
  N.DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  N.dataCurta = (iso) => (iso ? `${Number(iso.slice(8, 10))} ${MESES[Number(iso.slice(5, 7)) - 1]}` : '');
  N.dataLonga = (iso) => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
  /** Primeiro dia da semana que contém `data` (inicio: 0 = domingo, 1 = segunda). */
  N.inicioSemana = (data, inicio = 1) => N.addDias(data, -((N.diaSemana(data) - inicio + 7) % 7));
  N.diasDaSemana = (data, inicio = 1) => { const i = N.inicioSemana(data, inicio); return Array.from({ length: 7 }, (_, k) => N.addDias(i, k)); };
  N.inicioMes = (data) => data.slice(0, 8) + '01';
  N.fimMes = (data) => { const [a, m] = data.split('-').map(Number); return `${a}-${pad(m)}-${pad(new Date(a, m, 0).getDate())}`; };

  // ---------- fusos (IANA) ----------
  N.fusoLocal = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } };
  const formatadores = new Map();
  const partesNoFuso = (ms, tz) => {
    let f = formatadores.get(tz);
    if (!f) { f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); formatadores.set(tz, f); }
    const p = {};
    for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;
    return { a: Number(p.year), m: Number(p.month), d: Number(p.day), h: Number(p.hour) % 24, min: Number(p.minute), s: Number(p.second) };
  };
  /** Diferença (ms) entre a hora local do fuso e UTC naquele instante. */
  const deslocamento = (ms, tz) => { const p = partesNoFuso(ms, tz); return Date.UTC(p.a, p.m - 1, p.d, p.h, p.min, p.s) - Math.floor(ms / 1000) * 1000; };
  N.dataNoFuso = (iso, tz) => { const p = partesNoFuso(Date.parse(iso), tz); return `${p.a}-${pad(p.m)}-${pad(p.d)}`; };
  N.horaNoFuso = (iso, tz) => { const p = partesNoFuso(Date.parse(iso), tz); return `${pad(p.h)}:${pad(p.min)}`; };
  /** Horário de parede (data + "HH:MM") num fuso -> ms UTC. Em lacunas de horário de verão, avança para a hora válida. */
  N.msDeLocal = (data, hora, tz) => {
    const [a, m, d] = data.split('-').map(Number);
    const [h, min] = String(hora || '00:00').split(':').map(Number);
    const parede = Date.UTC(a, m - 1, d, h, min);
    let ms = parede - deslocamento(parede, tz);
    ms = parede - deslocamento(ms, tz);
    return ms;
  };
  N.isoDeLocal = (data, hora, tz) => new Date(N.msDeLocal(data, hora, tz)).toISOString();
  /** Divide o intervalo [inicio, fim) em pedaços por dia local do fuso: [{data, segundos}]. */
  N.dividirPorDia = (inicioIso, fimIso, tz) => {
    let ini = Date.parse(inicioIso);
    const fim = Date.parse(fimIso);
    const r = [];
    let guarda = 0;
    while (ini < fim && guarda++ < 400) {
      const data = N.dataNoFuso(new Date(ini).toISOString(), tz);
      const meiaNoite = N.msDeLocal(N.addDias(data, 1), '00:00', tz);
      const corte = Math.min(fim, meiaNoite > ini ? meiaNoite : fim);
      r.push({ data, segundos: Math.round((corte - ini) / 1000) });
      ini = corte;
    }
    return r;
  };

  // ---------- durações ----------
  /** "1:30" | "1:30:15" | "1,5" | "1.5" | "1,5h" | "90m" | "90 min" | "1h30" | "1h30m" | "2h" | "45min" -> segundos; NaN se inválido. */
  N.lerDuracao = (txt) => {
    const s = String(txt == null ? '' : txt).trim().toLowerCase().replace(/\s+/g, '').replace(/horas?$/, 'h').replace(/minutos?$|mins?$/, 'm');
    if (!s) return NaN;
    let m;
    if ((m = s.match(/^(\d{1,3}):([0-5]\d)(?::([0-5]\d))?$/))) return Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3] || 0);
    if ((m = s.match(/^(\d{1,3})h(?:([0-5]?\d)m?)?$/))) return Number(m[1]) * 3600 + Number(m[2] || 0) * 60;
    if ((m = s.match(/^(\d{1,5})m$/))) return Number(m[1]) * 60;
    if ((m = s.match(/^(\d{1,3})(?:[.,](\d{1,3}))?h?$/))) return Math.round(Number(`${m[1]}.${m[2] || 0}`) * 3600);
    return NaN;
  };
  N.fmtDuracao = (seg) => { const t = Math.max(0, Math.round(Number(seg) || 0)); const h = Math.floor(t / 3600); const mi = Math.floor((t % 3600) / 60); return `${h}:${pad(mi)}`; };
  N.fmtCronometro = (seg) => { const t = Math.max(0, Math.floor(Number(seg) || 0)); return `${Math.floor(t / 3600)}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`; };
  N.horasDecimais = (seg) => Math.round((Number(seg) || 0) / 36) / 100;
  N.MAX_ENTRADA_S = 24 * 3600;
  N.LIMITE_AVISO_S = 12 * 3600;

  // ---------- moedas ----------
  N.MOEDAS = ['BRL', 'USD', 'EUR', 'GBP', 'CAD', 'AUD', 'NZD', 'CHF', 'JPY', 'CNY', 'INR', 'KRW', 'MXN', 'ARS', 'CLP', 'COP', 'PEN', 'UYU', 'SEK', 'NOK', 'DKK', 'PLN'];
  const casasCache = new Map();
  N.casasMoeda = (moeda) => {
    if (!casasCache.has(moeda)) { let c = 2; try { c = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: moeda }).resolvedOptions().maximumFractionDigits; } catch (e) { /* padrão */ } casasCache.set(moeda, c); }
    return casasCache.get(moeda);
  };
  N.moedaValida = (m) => /^[A-Z]{3}$/.test(String(m || ''));
  /** "80" | "80,50" | "1.250,00" | "80.5" -> unidades menores (NaN se inválido). */
  N.paraMinor = (txt, moeda) => {
    let s = String(txt == null ? '' : txt).trim().replace(/[^\d.,-]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    const casas = N.casasMoeda(moeda);
    return Math.round(Number(s) * 10 ** casas);
  };
  N.deMinor = (minor, moeda) => (Number(minor) || 0) / 10 ** N.casasMoeda(moeda);
  N.fmtMoeda = (minor, moeda) => { try { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: moeda }).format(N.deMinor(minor, moeda)); } catch (e) { return `${moeda} ${N.deMinor(minor, moeda)}`; } };
  N.textoValor = (minor, moeda) => N.deMinor(minor, moeda).toLocaleString('pt-BR', { minimumFractionDigits: N.casasMoeda(moeda), maximumFractionDigits: N.casasMoeda(moeda), useGrouping: false });
  /** Tarifa vigente para área/quadro (quadro substitui a da área). */
  N.tarifaPara = (area, quadro) => {
    const q = quadro && Number.isFinite(quadro.valorHora) && quadro.valorHora != null;
    return { valorMinor: q ? quadro.valorHora : (Number(area && area.valorHora) || 0), moeda: (area && area.moeda) || 'BRL', origem: q ? 'quadro' : 'area' };
  };
  N.valorDe = (segundos, tarifa) => Math.round(((Number(segundos) || 0) / 3600) * ((tarifa && tarifa.valorMinor) || 0));

  // ---------- cronômetro: sessões com segmentos ----------
  N.segmentosOrdenados = (sessao) => Object.entries((sessao && sessao.segmentos) || {}).map(([id, s]) => ({ ...s, id })).sort((a, b) => (a.inicio < b.inicio ? -1 : 1));
  N.segmentoAberto = (sessao) => N.segmentosOrdenados(sessao).find((s) => !s.fim) || null;
  N.sessaoRodando = (sessao) => !!N.segmentoAberto(sessao);
  N.duracaoSessao = (sessao, agoraMs) => N.segmentosOrdenados(sessao).reduce((t, s) => t + Math.max(0, ((s.fim ? Date.parse(s.fim) : agoraMs) - Date.parse(s.inicio)) / 1000), 0);
  N.ativas = (sessoes) => (sessoes || []).filter((s) => s.estado === 'ativo');
  /** Entrada gerada ao encerrar: mesmo id da sessão (encerrar duas vezes grava o mesmo documento). */
  N.entradaDaSessao = (sessao, { fimIso, tarifa, nomes, agoraIso }) => {
    const segs = N.segmentosOrdenados(sessao).map((s) => ({ inicio: s.inicio, fim: s.fim || fimIso }))
      .filter((s) => Date.parse(s.fim) > Date.parse(s.inicio));
    const duracaoS = Math.round(segs.reduce((t, s) => t + (Date.parse(s.fim) - Date.parse(s.inicio)) / 1000, 0));
    const inicio = segs.length ? segs[0].inicio : fimIso;
    return {
      id: sessao.id, tipo: 'horario', origem: 'cronometro',
      areaId: sessao.areaId, quadroId: sessao.quadroId || null, tarefaId: sessao.tarefaId || null,
      descricao: sessao.descricao || '', faturavel: !!sessao.faturavel, fuso: sessao.fuso || 'UTC',
      segmentos: segs, inicio, fim: segs.length ? segs[segs.length - 1].fim : fimIso, duracaoS,
      data: N.dataNoFuso(inicio, sessao.fuso || 'UTC'), tarifa, nomes: nomes || {}, criadoEm: agoraIso || fimIso, editadoEm: null,
    };
  };

  // ---------- entradas ----------
  /** Entrada com horários (manual): segmento único. */
  N.entradaHorario = ({ id, areaId, quadroId, tarefaId, descricao, faturavel, fuso, data, horaInicio, horaFim, tarifa, nomes, agoraIso }) => {
    const ini = N.msDeLocal(data, horaInicio, fuso);
    let fim = N.msDeLocal(data, horaFim, fuso);
    if (fim <= ini) fim = N.msDeLocal(N.addDias(data, 1), horaFim, fuso); // passou da meia-noite
    const inicio = new Date(ini).toISOString(), fimIso = new Date(fim).toISOString();

  function criarDados() {
    const D = {

      estado: null,

      ouvirConta(fn) { this._ouvintesConta.add(fn); return () => this._ouvintesConta.delete(fn); },
      _avisar() { this.versao++; for (const fn of this._ouvintes) { try { fn(); } catch (e) { console.error(e); } } },
      _avisarConta() { for (const fn of this._ouvintesConta) { try { fn(this.usuario); } catch (e) { console.error(e); } } },

      async tentarDeNovo(f) {

      async entrar() {

      async sair({ forcar } = {}) {

      /** Lê entradas antigas (fora da janela), para relatórios e semanas passadas. */
      async carregarPeriodo(de, ate) {

      },
      async salvarDoc(col, obj) {
        this._exigirLogin();
        N.validar.id(obj.id);
        const dados = limpar(obj);
        const ref = this._col(col).doc(obj.id);
        return this._enfileirar(`${col}/${obj.id}`, () => this._confirmar(ref.set(dados), { tipo: 'doc', col, id: obj.id, dados }));
      },
      async excluirDoc(col, id) {

      },
      /** Grava só os campos indicados: pares [[['segmentos', id, 'fim'], valor], …]. D.APAGAR remove o campo. */
      async gravarCampos(col, id, pares) {

          let x = corpo;
          for (let i = 0; i < seg.length - 1; i++) x = x[seg[i]] = x[seg[i]] && typeof x[seg[i]] === 'object' ? x[seg[i]] : {};
          x[seg[seg.length - 1]] = valor === APAGAR ? this.fb.firestore.FieldValue.delete() : valor;
          campos.push(new FP(...seg));

        const paresJson = pares.map(([s, v]) => [s, v === APAGAR ? null : v]);

      },

      // ---------- lotes, backup, importação ----------
      async _emLotes(ops, aoAvancar) {
        for (let i = 0; i < ops.length; i += MAX_LOTE) {
          const b = this.db.batch();
          for (const op of ops.slice(i, i + MAX_LOTE)) op(b);
          await this._confirmar(b.commit());
          if (aoAvancar) aoAvancar(Math.min(ops.length, i + MAX_LOTE), ops.length);

      },
      async lerTudo() {

        for (const c of N.COLECOES) { const s = await this._col(c).get(); r[c] = s.docs.map((d) => ({ ...structuredClone(d.data()), id: d.id })); }

      },
      listaBackups() { return this.estado.backups.slice().sort((a, b) => (a.criadoEm < b.criadoEm ? 1 : -1)); },
      async criarBackup(motivo, dadosProntos) {

        const id = this.novoId('bk');

        ops.push((b) => b.set(this._col('backups').doc(id), { criadoEm: new Date().toISOString(), dia: N.hoje(), motivo: motivo || 'automático', hash: N.hashDados(dados), partes: partes.length, contagem: Object.fromEntries(N.COLECOES.map((c) => [c, (dados[c] || []).length])) }));

      },
      async excluirBackup(b) {

      },
      async lerBackup(b) {

      },
      /** Troca todos os dados (já validados), em lotes, com backup antes. Ordem: áreas, quadros, tarefas, depois o resto (as regras conferem os vínculos). */
      async substituirTudo(novos, aoAvancar) {
        this._exigirLogin();

        if (N.COLECOES.some((c) => (atual[c] || []).length)) await this.criarBackup('antes de substituir os dados', atual);
        // Ordem importa: as regras conferem os vínculos (área -> quadro -> tarefa -> horas).
        // Coleções com vínculo vão em lotes pequenos (as regras limitam a 20 consultas de vínculo por lote).
        const ordem = ['config', 'areas', 'quadros', 'tarefas', 'cronometros', 'entradas', 'recebimentos'];

<script>/* Operações do Expediente sobre a camada de dados: cronômetro (um ativo por usuário, idempotente),
   registros de horas validados, arquivamento sem perda de histórico. Testado no Node com o Firebase simulado. */
(function (raiz) {
  'use strict';
  const N = raiz.Nucleo;

  function criarServicos(D) {
    const ocupado = new Set();
    const erro = (msg, code = 'invalid-argument') => Object.assign(new Error(msg), { code });
    /** Trava contra clique duplo: a mesma operação não roda duas vezes ao mesmo tempo. */
    const unica = async (chave, fn) => {
      if (ocupado.has(chave)) return { ignorado: true };
      ocupado.add(chave);
      try { return await fn(); } finally { ocupado.delete(chave); }
    };
    const S = {
      ctx() {
        const e = D.estado;
        return { areas: new Map(e.areas.map((x) => [x.id, x])), quadros: new Map(e.quadros.map((x) => [x.id, x])), tarefas: new Map(e.tarefas.map((x) => [x.id, x])) };
      },
      nomes(areaId, quadroId, tarefaId) {
        const c = S.ctx();
        const a = c.areas.get(areaId) || {}, q = c.quadros.get(quadroId) || {}, t = c.tarefas.get(tarefaId) || {};
        return { area: a.nome || '', cliente: a.cliente || '', quadro: q.nome || '', tarefa: t.titulo || '' };
      },
      tarifa(areaId, quadroId) { const c = S.ctx(); return N.tarifaPara(c.areas.get(areaId), c.quadros.get(quadroId)); },
      ativas() { return N.ativas([...D.estado.cronometros.values()]).sort((a, b) => ((a.criadoEm || '') < (b.criadoEm || '') ? -1 : 1)); },

      /** Confere área/quadro/tarefa antes de iniciar ou registrar. */
      conferirVinculo({ areaId, quadroId, tarefaId }) {
        const c = S.ctx();
        const a = c.areas.get(areaId);
        if (!a) throw erro('Escolha a área de trabalho.');
        if (a.arquivada) throw erro('Esta área está arquivada.');
        if (a.modulos && a.modulos.horas === false) throw erro('Esta área não usa o registro de horas.');
        if (a.modulos && a.modulos.quadros && !quadroId) throw erro('Nesta área, as horas precisam estar ligadas a um quadro.');
        if (quadroId) { const q = c.quadros.get(quadroId); if (!q || q.areaId !== areaId) throw erro('O quadro não pertence a esta área.'); }
        if (tarefaId) { const t = c.tarefas.get(tarefaId); if (!t || t.quadroId !== quadroId) throw erro('A tarefa não pertence a este quadro.'); }
      },

      // ---------- cronômetro ----------
      iniciar(dados) {

            descricao: N.validar.texto(dados.descricao, 200, 'Descrição'), faturavel: !!dados.faturavel, fuso: dados.fuso || N.fusoLocal(),
            segmentos: { [D.novoId('sg')]: { inicio: agora, fim: null } }, estado: 'ativo', criadoEm: agora,

      pausar(id) {

        });
      },
      retomar(id) {
        return unica('retomar:' + id, async () => {
          const s = D.estado.cronometros.get(id);
          if (!s || s.estado !== 'ativo' || N.segmentoAberto(s)) return { ignorado: true };
          return D.gravarCampos('cronometros', id, [[['segmentos', D.novoId('sg')], { inicio: new Date().toISOString(), fim: null }]]);
        });
      },
      /** Encerra e registra. Encerrar duas vezes (ou em dois aparelhos) grava o mesmo documento: nunca duplica. */
      encerrar(id, opts = {}) { return unica('encerrar:' + id, () => S._encerrar(id, opts)); },
      async _encerrar(id, { fimIso } = {}) {
        const s = D.estado.cronometros.get(id);

        const segs = N.segmentosOrdenados(s);
        if (segs.length && Date.parse(fim) < Date.parse(segs[segs.length - 1].inicio)) throw erro('O fim precisa ser depois do início.');
        const entrada = N.entradaDaSessao(s, { fimIso: fim, tarifa: S.tarifa(s.areaId, s.quadroId), nomes: S.nomes(s.areaId, s.quadroId, s.tarefaId), agoraIso: new Date().toISOString() });
        if (entrada.duracaoS > N.MAX_ENTRADA_S) throw erro('Este cronômetro passou de 24 horas. Informe o horário em que você parou de trabalhar.', 'sessao-longa');
        const aberto = N.segmentoAberto(s);

        if (aberto) fecha.push([['segmentos', aberto.id, 'fim'], fim]);
        if (entrada.duracaoS > 0) await D.salvarDoc('entradas', entrada);
        await D.gravarCampos('cronometros', id, fecha);

      },
      descartar(id) { return unica('encerrar:' + id, () => D.gravarCampos('cronometros', id, [[['estado'], 'descartado'], [['encerradoEm'], new Date().toISOString()]])); },
      /** Corrige o início do cronômetro (primeiro segmento). */
      corrigirInicio(id, novoIso) {

          return D.gravarCampos('cronometros', id, [[['segmentos', segs[0].id, 'inicio'], new Date(ms).toISOString()], [['criadoEm'], new Date(ms).toISOString()]]);
        });
      },
      /** Atualiza área/quadro/tarefa/descrição/faturável do cronômetro rodando. */

    return `<div class="usuario"><div class="avatar">${u.foto ? `<img src="${esc(u.foto)}" alt="" referrerpolicy="no-referrer">` : `<span>${ini}</span>`}</div><div class="quem"><strong>${esc(u.nome || 'Você')}</strong><small>${esc(u.email)}</small></div><button type="button" class="botao fantasma peq" data-acao="sair">Sair</button></div>`;
  }

  // ---------- campos da área (usados no primeiro acesso e no editor) ----------
  function camposArea(a = {}) {
    const m = a.modulos || { quadros: true, horas: true, relatorios: true };
    const moeda = a.moeda || 'BRL';
    return `<div class="campos">
      <label class="campo"><span>Nome da área</span><input id="ar-nome" maxlength="80" value="${esc(a.nome || '')}" placeholder="Ex.: Estúdio Lua" autofocus></label>
      <label class="campo"><span>Cliente</span><input id="ar-cli" maxlength="80" value="${esc(a.cliente || '')}" placeholder="Opcional"></label>
      <label class="campo"><span>Moeda</span><select id="ar-moeda">${N.MOEDAS.map((x) => opt(x, x, x === moeda)).join('')}</select></label>
      <label class="campo"><span>Valor por hora</span><input id="ar-valor" inputmode="decimal" value="${a.valorHora != null ? esc(N.textoValor(a.valorHora, moeda)) : ''}" placeholder="Ex.: 80,00"></label></div>
      <fieldset class="campo"><legend>Cor</legend><div class="cores">${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<label><input type="radio" name="ar-cor" value="${i}"${(a.cor ?? 0) === i ? ' checked' : ''} aria-label="Cor ${i + 1}"><span style="background:${cor(i)}"></span></label>`).join('')}</div></fieldset>
      <fieldset class="campo"><legend>O que esta área usa</legend>
        <label class="check"><input type="checkbox" id="ar-mq"${m.quadros ? ' checked' : ''}> Quadros de tarefas (as horas ficam ligadas a um quadro)</label>
        <label class="check"><input type="checkbox" id="ar-mh"${m.horas !== false ? ' checked' : ''}> Horas (cronômetro e lançamento manual)</label>
        <label class="check"><input type="checkbox" id="ar-mr"${m.relatorios !== false ? ' checked' : ''}> Relatórios</label></fieldset>
      <label class="check"><input type="checkbox" id="ar-fat"${a.faturavelPadrao !== false ? ' checked' : ''}> Horas faturáveis por padrão</label>`;
  }
  function lerArea(v, base) {
    const nome = N.validar.texto(val(v, '#ar-nome'), 80, 'Nome');
    if (!nome) throw Object.assign(new Error('Dê um nome para a área.'), { code: 'invalid-argument' });
    const moeda = val(v, '#ar-moeda');
    const txt = val(v, '#ar-valor');
    const valorHora = txt ? N.paraMinor(txt, moeda) : 0;
    if (Number.isNaN(valorHora) || valorHora < 0) throw Object.assign(new Error('Valor por hora inválido. Exemplo: 80,00'), { code: 'invalid-argument' });
    const modulos = { quadros: $('#ar-mq', v).checked, horas: $('#ar-mh', v).checked, relatorios: $('#ar-mr', v).checked };
    if (!modulos.quadros && !modulos.horas) throw Object.assign(new Error('Ligue pelo menos Quadros ou Horas.'), { code: 'invalid-argument' });
    return { ...(base || { id: D.novoId('ar'), criadoEm: agoraIso(), arquivada: false, ordem: C().areas.length }), nome, cliente: N.validar.texto(val(v, '#ar-cli'), 80, 'Cliente'), moeda, valorHora, faturavelPadrao: $('#ar-fat', v).checked, modulos, cor: Number(($('input[name="ar-cor"]:checked', v) || {}).value || 0) };
  }
  function telaPrimeira() {
    return `<form class="primeira" id="form-primeira" novalidate><div><div class="rotulo-mini">Primeiro acesso</div><h2>Crie sua primeira área de trabalho</h2>
      <p class="mudo" style="margin-top:6px">Uma área por cliente (ou projeto). Cada uma tem moeda e valor por hora próprios, e você escolhe o que ela usa: um cliente com quadros de tarefas, outro só com cronômetro e relatório.</p></div>
      <section class="cartao" style="display:flex;flex-direction:column;gap:14px">${camposArea()}</section>
      <div class="erro-campo" id="pr-erro"></div><button type="submit" class="botao primario grande largo">Criar e começar</button></form>`;
  }
  function ligarPrimeira() {
    $('#form-primeira').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = $('#form-primeira');
      try {
        const a = lerArea(f);
        $('#form-primeira button[type=submit]').disabled = true;
        if (!D.estado.config) await D.salvarDoc('config', { id: 'eu', inicioSemana: 1, metaDiaS: null, metaSemanaS: null });
        await D.salvarDoc('areas', a);
        if (a.modulos.quadros) await D.salvarDoc('quadros', novoQuadro(a.id, 'Quadro principal'));
        S.areaSel = ''; S.status = 'ok'; S.aba = a.modulos.quadros ? 'quadros' : 'cronometro';
        render();
        toast('Área criada. Crie as próximas em Áreas.', { ms: 4500 });
      } catch (err) { $('#pr-erro').textContent = D.mensagemErro(err); $('#form-primeira button[type=submit]').disabled = false; }
    });
  }
  const novoQuadro = (areaId, nome) => ({ id: D.novoId('qd'), areaId, nome, colunas: COLUNAS_PADRAO.map((n, i) => ({ id: 'col' + (i + 1), nome: n })), valorHora: null, arquivado: false, criadoEm: agoraIso() });

  // ====================================================================
  // BARRA DO CRONÔMETRO ATIVO (em todas as abas)
  // ====================================================================
  function barraAtiva() {
    const c = C();
    if (!c.ativas.length) return '';
    let h = '';
    if (c.ativas.length > 1) h += `<div class="banner perigo"><div><strong>Há ${c.ativas.length} cronômetros ativos</strong>Eles foram iniciados em aparelhos diferentes sem internet. Escolha o que fazer com cada um.</div><button type="button" class="botao peq" data-acao="resolver-conflito">Resolver</button></div>`;
    const s = c.ativas[c.ativas.length - 1];
    const rodando = N.sessaoRodando(s);
    const r = rotuloEntrada(c, s);
    const dur = N.duracaoSessao(s, Date.now());
    for (const x of c.ativas) {
      const dx = N.duracaoSessao(x, Date.now());
      if (dx > N.LIMITE_AVISO_S) h += `<div class="banner"><div><strong>Cronômetro ligado há ${N.fmtDuracao(dx)}${c.ativas.length > 1 ? ` (${esc(rotuloEntrada(c, x).titulo)})` : ''}</strong>Esqueceu de parar? Ajuste o horário em que você parou de trabalhar.</div><button type="button" class="botao peq" data-acao="parar" data-id="${esc(x.id)}">Ajustar e parar</button></div>`;
    }
    if (S.aba === 'cronometro') return h; // a própria aba já mostra o cronômetro grande
    h += `<div class="ativo${rodando ? '' : ' pausado'}" role="region" aria-label="Cronômetro ativo"><span class="ponto"></span><span class="tempo" data-tempo-sessao="${esc(s.id)}">${N.fmtCronometro(dur)}</span>
      <div class="info clicavel" data-acao="editar-ativo" data-id="${esc(s.id)}"><strong>${esc(r.titulo)}</strong><small>${rodando ? '' : 'Pausado · '}${esc(r.partes.join(' · '))}</small></div>
      <button type="button" data-acao="${rodando ? 'pausar' : 'retomar'}" data-id="${esc(s.id)}" aria-label="${rodando ? 'Pausar' : 'Retomar'}">${ic(rodando ? 'pausa' : 'play')}</button>
      <button type="button" class="forte" data-acao="parar" data-id="${esc(s.id)}" aria-label="Parar e registrar">${ic('parar')}</button></div>`;
    return h;
  }
  function tique() {
    const c = D.estado ? Sv.ativas() : [];
    for (const el of $$('[data-tempo-sessao]')) { const s = c.find((x) => x.id === el.dataset.tempoSessao); if (s) el.textContent = N.fmtCronometro(N.duracaoSessao(s, Date.now())); }
    const hoje = $('#total-hoje');
    if (hoje) hoje.textContent = N.fmtDuracao(totalHoje());
    const m = $('#meta-dia-barra');
    if (m && C().cfg.metaDiaS) m.style.width = Math.min(100, (totalHoje() / C().cfg.metaDiaS) * 100) + '%';
  }
  setInterval(() => { if (S.status === 'ok') tique(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.status === 'ok') tique(); });
  function totalHoje() {
    const c = C();
    let t = 0;
    for (const e of c.entradas) if (c.daArea(e)) for (const p of N.distribuicao(e)) if (p.data === c.hoje) t += p.segundos;
    for (const s of c.ativas) if (c.daArea(s)) t += N.duracaoSessao(s, Date.now());
    return t;
  }

  // ====================================================================
  // CRONÔMETRO
  // ====================================================================
  function vCronometro() {
    const c = C();
    let h = '';
    if (!c.areasHoras.length) return h + `<section class="cartao"><div class="vazio"><strong>Nenhuma área com registro de horas</strong><span>Crie uma área (um cliente ou projeto) para começar a cronometrar.</span><button type="button" class="botao primario peq" data-acao="nova-area">Criar área</button></div></section>`;
    if (!c.ativas.length) {
      const f = S.form;
      const areaId = c.areasHoras.some((a) => a.id === (S.areaSel || f.areaId)) ? (S.areaSel || f.areaId) : c.areasHoras[0].id;
      const area = c.areaMap.get(areaId);
      h += `<section class="cartao"><form class="iniciar" id="form-iniciar" novalidate>
        <div style="grid-column:1/-1">${camposVinculo('in', { areaId, quadroId: f.quadroId, tarefaId: f.tarefaId }, c.areasHoras)}</div>
        <label class="campo descricao"><span>No que você vai trabalhar?</span><input id="in-desc" maxlength="200" placeholder="Descrição (opcional)" value="${esc(f.areaId === areaId ? f.descricao || '' : '')}" autocomplete="off"></label>
        <div class="acoes"><button type="submit" class="botao primario grande">${ic('play')}Iniciar</button>
          <label class="check"><input type="checkbox" id="in-fat"${(f.areaId === areaId ? f.faturavel ?? area.faturavelPadrao : area.faturavelPadrao) !== false ? ' checked' : ''}> Faturável</label>
          <button type="button" class="botao" data-acao="lancar">${ic('mais')}Lançar horas</button></div></form></section>`;
    } else {
      const s = c.ativas[c.ativas.length - 1];
      const segs = N.segmentosOrdenados(s);
      h += `<section class="cartao" style="display:flex;flex-direction:column;gap:12px"><div class="rotulo-mini">${N.sessaoRodando(s) ? 'Trabalhando agora' : 'Pausado'}</div>
        <div class="relogio" data-tempo-sessao="${esc(s.id)}">${N.fmtCronometro(N.duracaoSessao(s, Date.now()))}</div>
        <div class="mudo" style="font-size:14px">Começou às ${N.horaNoFuso(segs[0].inicio, s.fuso)}${N.dataNoFuso(segs[0].inicio, s.fuso) !== c.hoje ? ` de ${N.dataCurta(N.dataNoFuso(segs[0].inicio, s.fuso))}` : ''}${segs.length > 1 ? ` · ${segs.length - 1} pausa${segs.length > 2 ? 's' : ''}` : ''} · <button type="button" class="botao fantasma peq" data-acao="corrigir-inicio" data-id="${esc(s.id)}" style="min-height:auto;padding:0 4px">corrigir início</button></div>
        <div class="linha-botoes"><button type="button" class="botao grande" data-acao="${N.sessaoRodando(s) ? 'pausar' : 'retomar'}" data-id="${esc(s.id)}">${ic(N.sessaoRodando(s) ? 'pausa' : 'play')}${N.sessaoRodando(s) ? 'Pausar' : 'Retomar'}</button>
          <button type="button" class="botao primario grande" data-acao="parar" data-id="${esc(s.id)}">${ic('parar')}Parar e registrar</button>
          <button type="button" class="botao" data-acao="editar-ativo" data-id="${esc(s.id)}">Editar</button><button type="button" class="botao fantasma" data-acao="descartar" data-id="${esc(s.id)}">Descartar</button></div></section>`;
    }
    const rec = N.recentes(c.entradas.filter((e) => c.daArea(e) && c.areaMap.get(e.areaId) && !c.areaMap.get(e.areaId).arquivada && (!e.quadroId || (c.quadroMap.get(e.quadroId) && !c.quadroMap.get(e.quadroId).arquivado))));
    if (rec.length) h += `<section><div class="rotulo-mini" style="margin-bottom:6px">Recentes · toque para iniciar</div><div class="recentes">${rec.map((x, i) => { const r = rotuloEntrada(c, x); return `<button type="button" class="chip-botao" data-acao="iniciar-recente" data-i="${i}" title="${esc([r.titulo, ...r.partes].join(' · '))}">${ic('play')}<span>${esc(r.titulo)} · ${esc(r.partes[r.partes.length - 1] || '')}</span></button>`; }).join('')}</div></section>`;
    window.__recentes = rec;
    if (c.cfg.metaDiaS) h += `<section class="cartao"><div class="cartao-cab" style="margin-bottom:6px"><h2>Meta de hoje</h2><small><span class="num" id="total-hoje">${N.fmtDuracao(totalHoje())}</span> de ${N.fmtDuracao(c.cfg.metaDiaS)}</small></div><div class="barra"><i id="meta-dia-barra" style="width:${Math.min(100, (totalHoje() / c.cfg.metaDiaS) * 100)}%"></i></div></section>`;
    // registros dos últimos 7 dias
    const dias = Array.from({ length: 7 }, (_, i) => N.addDias(c.hoje, -i));
    const ents = c.entradas.filter((e) => c.daArea(e) && dias.includes(e.data));
    h += `<section class="cartao"><div class="cartao-cab"><h2>Últimos 7 dias</h2><button type="button" class="botao fantasma peq" data-acao="aba" data-aba="semana">Ver semana</button></div>`;
    if (!ents.length) h += `<div class="vazio"><strong>Nenhum registro nos últimos 7 dias</strong><span>Inicie o cronômetro ou lance horas que você esqueceu de marcar.</span></div>`;
    for (const d of dias) {
      const doDia = ents.filter((e) => e.data === d).sort((a, b) => ((b.inicio || b.criadoEm || '') > (a.inicio || a.criadoEm || '') ? 1 : -1));
      if (!doDia.length) continue;
      const tot = ents.reduce((t, e) => t + N.distribuicao(e).filter((p) => p.data === d).reduce((x, p) => x + p.segundos, 0), 0); // só a parte de cada registro que caiu neste dia
      h += `<div class="dia-cab"><strong>${d === c.hoje ? 'Hoje' : d === N.addDias(c.hoje, -1) ? 'Ontem' : `${N.DIAS[N.diaSemana(d)]}, ${N.dataCurta(d)}`}</strong><span class="num">${N.fmtDuracao(tot)}</span></div>`;
      h += doDia.map((e) => linhaRegistro(c, e)).join('');
    }
    return h + '</section>';
  }
  function linhaRegistro(c, e) {
    const r = rotuloEntrada(c, e);
    const a = c.areaMap.get(e.areaId) || {};
    const horario = e.tipo === 'horario' && e.inicio ? `${N.horaNoFuso(e.inicio, e.fuso)}–${N.horaNoFuso(e.fim, e.fuso)}${N.dataNoFuso(e.fim, e.fuso) !== e.data ? ' (+1 dia)' : ''}` : 'só duração';
    const pend = D.estado.pendentesDoc.has(e.id);
    return `<div class="registro"><span class="cor" style="background:${cor(a.cor)}"></span>
      <div class="txt" data-acao="editar-entrada" data-id="${esc(e.id)}" role="button" tabindex="0"><strong>${esc(r.titulo)}</strong><small>${esc(r.partes.join(' · '))} · ${horario}${e.faturavel ? ' · $' : ''}</small></div>
      <div class="dur">${N.fmtDuracao(e.duracaoS)}<small>${pend ? '⏳ pendente' : ''}</small></div>
      <button type="button" class="icone-botao" data-acao="continuar" data-id="${esc(e.id)}" aria-label="Continuar este trabalho">${ic('play')}</button></div>`;
  }
  async function iniciarCom(dados) {
    S.form = { ...dados }; pref.gravar('form', S.form);
    await exec(() => Sv.iniciar({ ...dados, fuso: N.fusoLocal() }), 'Cronômetro iniciado');
  }
  async function pararSessao(id) {
    const s = D.estado.cronometros.get(id);
    if (!s) return;
    const dur = N.duracaoSessao(s, Date.now());
    if (dur > N.LIMITE_AVISO_S) return modalFim(s, dur);
    const r = await exec(() => Sv.encerrar(id));
    if (r && r.duracaoS != null) toast(r.duracaoS > 0 ? `Registrado: ${N.fmtDuracao(r.duracaoS)}` : 'Cronômetro descartado (sem tempo)');
  }
  function modalFim(s, dur) {
    const segs = N.segmentosOrdenados(s);
    const ini = segs[0].inicio;
    const sugest = new Date(Math.min(Date.now(), Math.max(Date.parse(ini) + 8 * 3600e3, Date.parse(segs[segs.length - 1].inicio) + 60e3))).toISOString();
    abrirModal({
      titulo: 'Quando você parou de trabalhar?',
      corpo: `<p class="mudo">O cronômetro está ligado há ${N.fmtDuracao(dur)} (começou ${N.dataLonga(N.dataNoFuso(ini, s.fuso))} às ${N.horaNoFuso(ini, s.fuso)}). Um registro pode ter no máximo 24 horas.</p>
        <div class="campos"><label class="campo"><span>Data do fim</span><input type="date" id="fm-data" value="${N.dataNoFuso(sugest, s.fuso)}"></label><label class="campo"><span>Hora do fim</span><input type="time" id="fm-hora" value="${N.horaNoFuso(sugest, s.fuso)}"></label></div><div class="erro-campo"></div>`,
      rodape: rodapeForm('<button type="button" class="botao" data-x="agora">Parar agora mesmo</button>', 'Parar neste horário'),
      aoMontar: (v) => {
        v.querySelector('[data-x=agora]').onclick = async () => { const r = await exec(() => Sv.encerrar(s.id)); if (r) { fecharModal(v); toast(`Registrado: ${N.fmtDuracao(r.duracaoS || 0)}`); } };
        ligarEnvio(v, async () => {
          const fimIso = N.isoDeLocal(N.validar.data(val(v, '#fm-data')), val(v, '#fm-hora') || '00:00', s.fuso);
          if (Date.parse(fimIso) > Date.now()) return 'O fim não pode ser no futuro.';
          const r = await Sv.encerrar(s.id, { fimIso });
          toast(`Registrado: ${N.fmtDuracao(r.duracaoS || 0)}`);
          return true;
        });
      },
    });
  }
  function modalCorrigirInicio(id) {
    const s = D.estado.cronometros.get(id);
    if (!s) return;
    const ini = N.segmentosOrdenados(s)[0].inicio;
    abrirModal({
      titulo: 'Corrigir o início',
      corpo: `<p class="mudo">Esqueceu de dar o play na hora? Informe quando você começou de verdade.</p><div class="campos"><label class="campo"><span>Data</span><input type="date" id="ci-data" value="${N.dataNoFuso(ini, s.fuso)}"></label><label class="campo"><span>Hora</span><input type="time" id="ci-hora" value="${N.horaNoFuso(ini, s.fuso)}" autofocus></label></div><div class="erro-campo"></div>`,
      rodape: rodapeForm(),
      aoMontar: (v) => ligarEnvio(v, async () => { await Sv.corrigirInicio(id, N.isoDeLocal(N.validar.data(val(v, '#ci-data')), val(v, '#ci-hora'), s.fuso)); toast('Início corrigido'); return true; }),
    });
  }
  function modalEditarAtivo(id) {
    const c = C();
    const s = D.estado.cronometros.get(id);
    if (!s) return;
    abrirModal({
      titulo: 'Editar o cronômetro', largo: true,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:12px">${camposVinculo('ea', s, c.areasHoras)}<label class="campo"><span>Descrição</span><input id="ea-desc" maxlength="200" value="${esc(s.descricao || '')}"></label><label class="check"><input type="checkbox" id="ea-fat"${s.faturavel ? ' checked' : ''}> Faturável</label><div class="erro-campo"></div></form>`,
      rodape: rodapeForm('<button type="button" class="botao" data-x="inicio">Corrigir início</button>'),
      aoMontar: (v) => {
        const vinc = ligarVinculo(v, 'ea', s);
        v.querySelector('[data-x=inicio]').onclick = () => { fecharModal(v); modalCorrigirInicio(id); };
        ligarEnvio(v, async () => { await Sv.editarAtivo(id, { ...vinc(), descricao: val(v, '#ea-desc'), faturavel: $('#ea-fat', v).checked }); toast('Cronômetro atualizado'); return true; });
      },
    });
  }
  function modalConflito() {
    const c = C();
    abrirModal({
      titulo: 'Cronômetros ativos', largo: true, fecharNoVeu: true,
      corpo: `<p class="mudo">Cada um foi iniciado num aparelho diferente, sem internet. Pare e registre o que valeu; descarte o que foi engano.</p>${c.ativas.map((s) => { const r = rotuloEntrada(c, s); const segs = N.segmentosOrdenados(s); return `<div class="linha-lista"><div class="esq"><div><strong>${esc(r.titulo)}</strong><small>${esc(r.partes.join(' · '))} · começou ${N.dataCurta(N.dataNoFuso(segs[0].inicio, s.fuso))} às ${N.horaNoFuso(segs[0].inicio, s.fuso)} · ${N.fmtDuracao(N.duracaoSessao(s, Date.now()))}</small></div></div><div class="dir"><button type="button" class="botao primario peq" data-x="parar" data-id="${esc(s.id)}">Parar e registrar</button><button type="button" class="botao peq" data-x="descartar" data-id="${esc(s.id)}">Descartar</button></div></div>`; }).join('')}`,
      aoMontar: (v) => v.addEventListener('click', async (ev) => {
        const b = ev.target.closest('[data-x]'); if (!b) return;
        b.disabled = true;
        if (b.dataset.x === 'parar') await pararSessao(b.dataset.id); else await exec(() => Sv.descartar(b.dataset.id), 'Descartado');
        setTimeout(() => { if (Sv.ativas().length <= 1) fecharModal(v); }, 300);
      }),
    });
  }

  // ---------- registro manual / edição ----------
  function editarEntrada(e, { copia } = {}) {
    const c = C();
    const nova = !e || copia;
    const base = e ? structuredClone(e) : { tipo: 'duracao', areaId: S.areaSel || (c.areasHoras[0] || {}).id, data: c.hoje, faturavel: true, descricao: '' };
    if (copia) { base.id = undefined; base.data = c.hoje; base.criadoEm = undefined; }
    const multi = !nova && base.tipo === 'horario' && (base.segmentos || []).length > 1;
    const fuso = base.fuso || N.fusoLocal();
    const area0 = c.areaMap.get(base.areaId);
    const ini = base.tipo === 'horario' && base.inicio ? N.horaNoFuso(base.inicio, fuso) : '09:00';
    const fim = base.tipo === 'horario' && base.fim ? N.horaNoFuso(base.fim, fuso) : '10:00';
    const areasLista = c.areasHoras.concat(area0 && !c.areasHoras.includes(area0) ? [area0] : []);
    abrirModal({
      titulo: copia ? 'Duplicar registro' : e ? 'Editar registro' : 'Lançar horas', largo: true,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:12px">
        ${multi ? `<div class="aviso neutro">Registro do cronômetro com ${base.segmentos.length} trechos (com pausas): ${base.segmentos.map((s) => `${N.horaNoFuso(s.inicio, fuso)}–${N.horaNoFuso(s.fim, fuso)}`).join(', ')}. Os horários não são editáveis aqui; dá para mudar área, quadro, tarefa, descrição e faturável.</div>` : `
        <fieldset class="campo"><legend>Como registrar</legend><div class="chips"><label class="chip"><input type="radio" name="en-tipo" value="horario"${base.tipo === 'horario' ? ' checked' : ''}><span>Com horário de início e fim</span></label><label class="chip"><input type="radio" name="en-tipo" value="duracao"${base.tipo !== 'horario' ? ' checked' : ''}><span>Só a duração</span></label></div></fieldset>`}
        ${camposVinculo('en', base, areasLista)}
        <label class="campo"><span>Descrição</span><input id="en-desc" maxlength="200" value="${esc(base.descricao || '')}" placeholder="O que você fez"></label>
        <div class="campos tres"><label class="campo"><span>Data</span><input type="date" id="en-data" value="${esc(base.data)}"${multi ? ' disabled' : ''}></label>
          <label class="campo" id="en-ini-c"><span>Início</span><input type="time" id="en-ini" value="${ini}"></label><label class="campo" id="en-fim-c"><span>Fim</span><input type="time" id="en-fim" value="${fim}"></label>
          <label class="campo" id="en-dur-c"><span>Duração</span><input id="en-dur" inputmode="text" placeholder="1:30, 1,5 ou 90m" value="${base.tipo !== 'horario' && base.duracaoS ? N.fmtDuracao(base.duracaoS) : ''}"></label></div>
        <div class="aviso neutro" id="en-previa"></div>

        <div id="en-tarifa"></div><div class="erro-campo"></div></form>`,
