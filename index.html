      aoMontar: (v) => {
        let vinc = null;
        vinc = ligarVinculo(v, 'en', base, () => { if (vinc) atual(); });
        function tipo() { return multi ? 'horario' : ($('input[name="en-tipo"]:checked', v) || {}).value; }
        function atual() {
          if (!$('#en-previa', v)) return;
          const t = tipo();
          if (!multi) { $('#en-ini-c', v).hidden = t !== 'horario'; $('#en-fim-c', v).hidden = t !== 'horario'; $('#en-dur-c', v).hidden = t === 'horario'; }
          else { $('#en-ini-c', v).hidden = true; $('#en-fim-c', v).hidden = true; $('#en-dur-c', v).hidden = true; }
          let txt = '';
          if (multi) txt = `Duração: ${N.fmtDuracao(base.duracaoS)}`;
          else if (t === 'horario') { const a = val(v, '#en-ini'), b = val(v, '#en-fim'); if (a && b) { const ent = N.entradaHorario({ fuso, data: val(v, '#en-data') || c.hoje, horaInicio: a, horaFim: b }); txt = `Duração: ${N.fmtDuracao(ent.duracaoS)}${b <= a ? ' · termina no dia seguinte' : ''}`; } }
          else { const s = N.lerDuracao(val(v, '#en-dur')); txt = Number.isFinite(s) ? `Duração: ${N.fmtDuracao(s)} (sem horário)` : 'Formatos aceitos: 1:30, 1,5, 90m, 1h30'; }
          $('#en-previa', v).textContent = txt;
          // tarifa
          const sel = vinc();
          const nova2 = Sv.tarifa(sel.areaId, sel.quadroId);
          const usada = !nova && base.tarifa;
          $('#en-tarifa', v).innerHTML = usada && (usada.valorMinor !== nova2.valorMinor || usada.moeda !== nova2.moeda) && sel.areaId === base.areaId
            ? `<div class="aviso neutro">Tarifa deste registro: <b>${N.fmtMoeda(usada.valorMinor, usada.moeda)}/h</b> (da época). Atual: ${N.fmtMoeda(nova2.valorMinor, nova2.moeda)}/h.<label class="check" style="min-height:36px"><input type="checkbox" id="en-tarifa-atual"> Usar a tarifa atual neste registro</label></div>`
            : `<span class="mudo" style="font-size:13px">Tarifa: ${N.fmtMoeda(nova2.valorMinor, nova2.moeda)}/h${nova2.origem === 'quadro' ? ' (do quadro)' : ''}</span>`;
        }
        v.addEventListener('input', atual); v.addEventListener('change', atual); atual();
        const bx = v.querySelector('[data-x=excluir]');
        if (bx) bx.onclick = async () => {
          if (!(await confirmar({ titulo: 'Excluir registro?', texto: `${esc(N.fmtDuracao(base.duracaoS))} em ${esc(N.dataLonga(base.data))}.`, botao: 'Excluir', perigo: true }))) return;
          const orig = structuredClone(e);
          if (await exec(() => Sv.excluirEntrada(e.id))) { fecharModal(v); toast('Registro excluído', { desfazer: () => exec(() => D.salvarDoc('entradas', orig), 'Registro restaurado') }); }
        };
        const bd = v.querySelector('[data-x=duplicar]');
        if (bd) bd.onclick = () => { fecharModal(v); editarEntrada(e, { copia: true }); };
        ligarEnvio(v, async () => {
          const sel = vinc();
          const comum = { ...sel, descricao: N.validar.texto(val(v, '#en-desc'), 200, 'Descrição'), faturavel: $('#en-fat', v).checked };
          let ent;
          if (multi) ent = { ...base, ...comum, editadoEm: agoraIso() };
          else {
            const data = N.validar.data(val(v, '#en-data'));
            const id = nova ? D.novoId('en') : base.id;
            const meta = { id, data, agoraIso: nova ? agoraIso() : base.criadoEm };
            if (tipo() === 'horario') {
              if (!val(v, '#en-ini') || !val(v, '#en-fim')) return 'Informe início e fim.';
              ent = N.entradaHorario({ ...comum, ...meta, fuso, horaInicio: val(v, '#en-ini'), horaFim: val(v, '#en-fim') });
            } else {
              const s = N.lerDuracao(val(v, '#en-dur'));
              if (!Number.isFinite(s) || s <= 0) return 'Duração inválida. Use 1:30, 1,5, 90m ou 1h30.';
              ent = N.entradaDuracao({ ...comum, ...meta, duracaoS: s });
            }
            ent.origem = nova ? 'manual' : (base.origem || 'manual');
            if (!nova) { ent.editadoEm = agoraIso(); ent.tarifa = base.tarifa; }
          }
          const manter = !nova && sel.areaId === base.areaId && !($('#en-tarifa-atual', v) && $('#en-tarifa-atual', v).checked);
          const r = await Sv.salvarEntrada(ent, { manterTarifa: manter });
          toast(r.avisos && r.avisos.length ? `Salvo. Atenção: se sobrepõe a ${r.avisos.length} outro${r.avisos.length > 1 ? 's' : ''} registro${r.avisos.length > 1 ? 's' : ''}.` : (r.pendente ? 'Salvo no aparelho; envia quando a internet voltar' : 'Registro salvo'), { ms: 5000 });
          return true;
        });
      },
    });
  }

  // ====================================================================
  // QUADROS
  // ====================================================================
  function vQuadros() {
    const c = C();
    if (!c.areasQuadros.length) return `<section class="cartao"><div class="vazio"><strong>Nenhuma área com quadros</strong><span>Ligue "Quadros de tarefas" numa área (em Áreas) para organizar as tarefas desse cliente.</span><button type="button" class="botao primario peq" data-acao="aba" data-aba="areas">Ir para Áreas</button></div></section>`;
    const area = c.areasQuadros.find((a) => a.id === S.areaSel) || c.areasQuadros[0];
    const quadros = c.quadrosDe(area.id);
    let h = '';
    if (c.areasQuadros.length > 1 && !S.areaSel) h += `<div class="chips">${c.areasQuadros.map((a) => `<button type="button" class="chip-botao" data-acao="area-quadros" data-id="${esc(a.id)}" aria-pressed="${a.id === area.id}"><span class="ponto-cor" style="background:${cor(a.cor)}"></span><span>${esc(a.nome)}</span></button>`).join('')}</div>`;
    if (!quadros.length) return h + `<section class="cartao"><div class="vazio"><strong>${esc(area.nome)} ainda não tem quadros</strong><button type="button" class="botao primario peq" data-acao="novo-quadro" data-area="${esc(area.id)}">Criar quadro</button></div></section>`;
    const qId = quadros.some((q) => q.id === S.quadroPorArea[area.id]) ? S.quadroPorArea[area.id] : quadros[0].id;
    const quadro = c.quadroMap.get(qId);
    h += `<div class="linha-botoes" style="justify-content:space-between"><div class="chips">${quadros.map((q) => `<button type="button" class="chip-botao" data-acao="escolher-quadro" data-area="${esc(area.id)}" data-id="${esc(q.id)}" aria-pressed="${q.id === qId}"><span>${esc(q.nome)}</span></button>`).join('')}<button type="button" class="chip-botao" data-acao="novo-quadro" data-area="${esc(area.id)}">${ic('mais')}<span>Quadro</span></button></div>
      <div class="chips"><button type="button" class="chip-botao" data-acao="vista" data-v="kanban" aria-pressed="${S.vista === 'kanban'}"><span>Colunas</span></button><button type="button" class="chip-botao" data-acao="vista" data-v="lista" aria-pressed="${S.vista === 'lista'}"><span>Lista</span></button><button type="button" class="chip-botao" data-acao="editar-quadro" data-id="${esc(qId)}"><span>Editar quadro</span></button></div></div>`;
    const tarefas = c.tarefasDe(qId);
    return h + (S.vista === 'lista' ? vLista(c, quadro, tarefas) : vKanban(c, quadro, tarefas));
  }
  function infoPrazo(t, hoje) {
    if (!t.prazo) return '';
    const cls = t.prazo < hoje && !t.concluidaEm ? 'bad' : t.prazo === hoje ? 'warn' : '';
    return `<span class="pill ${cls}">${t.prazo < hoje && !t.concluidaEm ? 'venceu ' : ''}${N.dataCurta(t.prazo)}</span>`;
  }
  function cartaoTarefa(c, t) {
    const ck = N.progressoChecklist(t);
    const tempo = c.tempoTarefa.get(t.id) || 0;
    const ativa = c.ativas.find((s) => s.tarefaId === t.id);
    return `<div class="cartao-tarefa" draggable="true" data-tarefa="${esc(t.id)}" data-acao="abrir-tarefa" data-id="${esc(t.id)}" role="button" tabindex="0">
      <div class="titulo">${esc(t.titulo)}</div>
      ${(t.etiquetas || []).length ? `<div class="chips" style="gap:4px">${t.etiquetas.map((x) => `<span class="etiqueta">${esc(x)}</span>`).join('')}</div>` : ''}
      <div class="rodape-t"><span title="Prioridade ${esc(NOME_PRIO[t.prioridade] || '')}"><span class="prio ${esc(t.prioridade)}"></span> ${esc(NOME_PRIO[t.prioridade] || '')}</span>${infoPrazo(t, c.hoje)}${ck.total ? `<span>☑ ${ck.feitos}/${ck.total}</span>` : ''}${tempo ? `<span class="num" title="Horas registradas nesta tarefa">${N.fmtDuracao(tempo)} h</span>` : ''}
        <button type="button" class="icone-botao play" data-acao="cronometrar-tarefa" data-id="${esc(t.id)}" aria-label="Cronometrar ${esc(t.titulo)}" ${ativa ? 'disabled style="color:var(--accent)"' : ''}>${ic('play')}</button></div></div>`;
  }
  function vKanban(c, quadro, tarefas) {
    return `<div class="kanban" id="kanban" data-quadro="${esc(quadro.id)}">${quadro.colunas.map((col) => {
      const ts = tarefas.filter((t) => (t.colunaId || quadro.colunas[0].id) === col.id || (!quadro.colunas.some((x) => x.id === t.colunaId) && col.id === quadro.colunas[0].id));
      return `<div class="coluna" data-coluna="${esc(col.id)}"><div class="coluna-cab"><strong>${esc(col.nome)}</strong><span class="pill">${ts.length}</span></div>
        <form class="nova-tarefa" data-nova="${esc(col.id)}"><input id="nt-${esc(col.id)}" maxlength="200" placeholder="+ Nova tarefa" aria-label="Nova tarefa em ${esc(col.nome)}"></form>
        ${ts.map((t) => cartaoTarefa(c, t)).join('')}</div>`;
    }).join('')}</div>`;
  }
  function vLista(c, quadro, tarefas) {
    const f = S.lista;
    const q = f.busca.toLowerCase();
    let l = tarefas.filter((t) => (!f.coluna || t.colunaId === f.coluna) && (!f.prioridade || t.prioridade === f.prioridade) && (!q || `${t.titulo} ${(t.etiquetas || []).join(' ')}`.toLowerCase().includes(q)));
    if (f.prazo === 'vencidas') l = l.filter((t) => t.prazo && t.prazo < c.hoje);
    if (f.prazo === 'semana') l = l.filter((t) => t.prazo && t.prazo >= c.hoje && t.prazo <= N.addDias(c.hoje, 7));
    const nomeCol = (id) => (quadro.colunas.find((x) => x.id === id) || quadro.colunas[0]).nome;
    return `<section class="cartao"><div class="campos" style="grid-template-columns:2fr 1fr 1fr 1fr;margin-bottom:8px">
      <input class="entrada" id="ls-busca" placeholder="Buscar tarefa ou etiqueta" value="${esc(f.busca)}">
      <select class="entrada" id="ls-coluna">${opt('', 'Todas as colunas', !f.coluna)}${quadro.colunas.map((x) => opt(x.id, x.nome, f.coluna === x.id)).join('')}</select>
      <select class="entrada" id="ls-prio">${opt('', 'Qualquer prioridade', !f.prioridade)}${N.PRIORIDADES.map(([k, t]) => opt(k, t, f.prioridade === k)).join('')}</select>
      <select class="entrada" id="ls-prazo">${opt('', 'Qualquer prazo', !f.prazo)}${opt('vencidas', 'Vencidas', f.prazo === 'vencidas')}${opt('semana', 'Próximos 7 dias', f.prazo === 'semana')}</select></div>
      <div class="lista-tarefas">${l.length ? l.map((t) => `<div class="linha-t" data-acao="abrir-tarefa" data-id="${esc(t.id)}" role="button" tabindex="0"><div style="min-width:0"><strong style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.titulo)}</strong><small class="mudo">${esc(nomeCol(t.colunaId))}</small></div><span class="so-pc"><span class="prio ${esc(t.prioridade)}"></span> ${esc(NOME_PRIO[t.prioridade])}</span><span class="so-pc">${infoPrazo(t, c.hoje) || '—'}</span><span class="num">${N.fmtDuracao(c.tempoTarefa.get(t.id) || 0)}</span><button type="button" class="icone-botao" data-acao="cronometrar-tarefa" data-id="${esc(t.id)}" aria-label="Cronometrar">${ic('play')}</button></div>`).join('') : '<div class="vazio"><strong>Nenhuma tarefa com esses filtros</strong></div>'}</div></section>`;
  }
  async function criarTarefa(quadroId, colunaId, titulo) {
    const c = C();
    const q = c.quadroMap.get(quadroId);
    const ts = c.tarefasDe(quadroId).filter((t) => t.colunaId === colunaId);
    const ordem = N.ordemEntre(ts.length ? ts[ts.length - 1].ordem : null, null);
    await exec(() => D.salvarDoc('tarefas', { id: D.novoId('tf'), areaId: q.areaId, quadroId, colunaId, titulo: N.validar.texto(titulo, 200, 'Título'), descricao: '', prioridade: 'media', prazo: null, etiquetas: [], checklist: {}, estimativaS: null, ordem, arquivada: false, concluidaEm: null, criadoEm: agoraIso() }));
  }
  async function moverTarefa(tid, colunaId, antesDeId) {
    const c = C();
    const t = c.tarefaMap.get(tid);
    if (!t) return;
    const q = c.quadroMap.get(t.quadroId);
    const lista = c.tarefasDe(t.quadroId).filter((x) => x.colunaId === colunaId && x.id !== tid);
    const i = antesDeId ? lista.findIndex((x) => x.id === antesDeId) : -1;
    const antes = i > 0 ? lista[i - 1].ordem : i === 0 ? null : (lista.length ? lista[lista.length - 1].ordem : null);
    const depois = i >= 0 ? lista[i].ordem : null;
    const ultima = q.colunas[q.colunas.length - 1].id;
    await exec(() => D.gravarCampos('tarefas', tid, [[['colunaId'], colunaId], [['ordem'], N.ordemEntre(antes, depois)], [['concluidaEm'], colunaId === ultima ? (t.concluidaEm || agoraIso()) : null]]));
  }
  // arrastar e soltar (computador)
  let arrastando = null;
  document.addEventListener('dragstart', (e) => { const el = e.target.closest && e.target.closest('[data-tarefa]'); if (!el) return; arrastando = el.dataset.tarefa; el.classList.add('arrastando'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', arrastando); } catch (x) { /* nada */ } });
  document.addEventListener('dragend', (e) => { const el = e.target.closest && e.target.closest('[data-tarefa]'); if (el) el.classList.remove('arrastando'); $$('.coluna.alvo').forEach((x) => x.classList.remove('alvo')); arrastando = null; });
  document.addEventListener('dragover', (e) => { const col = e.target.closest && e.target.closest('.coluna'); if (!col || !arrastando) return; e.preventDefault(); $$('.coluna.alvo').forEach((x) => x !== col && x.classList.remove('alvo')); col.classList.add('alvo'); });
  document.addEventListener('drop', (e) => {
    const col = e.target.closest && e.target.closest('.coluna'); if (!col || !arrastando) return;
    e.preventDefault();
    const sob = e.target.closest('[data-tarefa]');
    moverTarefa(arrastando, col.dataset.coluna, sob && sob.dataset.tarefa !== arrastando ? sob.dataset.tarefa : null);
  });

  async function abrirTarefa(id) {

    const t = c.tarefaMap.get(id);
    if (!t) return;
    const q = c.quadroMap.get(t.quadroId);
    abrirModal({
      titulo: 'Tarefa', largo: true,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:12px">
        <label class="campo"><span>Título</span><input id="tf-titulo" maxlength="200" value="${esc(t.titulo)}"></label>
        <div class="campos tres"><label class="campo"><span>Coluna</span><select id="tf-col">${q.colunas.map((x) => opt(x.id, x.nome, x.id === t.colunaId)).join('')}</select></label>
          <label class="campo"><span>Prazo</span><input type="date" id="tf-prazo" value="${esc(t.prazo || '')}"></label>
          <label class="campo"><span>Estimativa</span><input id="tf-est" placeholder="ex.: 4h" value="${t.estimativaS ? N.fmtDuracao(t.estimativaS) : ''}"></label></div>
        <fieldset class="campo"><legend>Prioridade</legend><div class="chips">${N.PRIORIDADES.map(([k, n]) => `<label class="chip"><input type="radio" name="tf-prio" value="${k}"${t.prioridade === k ? ' checked' : ''}><span><span class="prio ${k}"></span>${n}</span></label>`).join('')}</div></fieldset>
        <label class="campo"><span>Etiquetas (separe por vírgula)</span><input id="tf-etq" maxlength="300" value="${esc((t.etiquetas || []).join(', '))}" placeholder="ex.: capa, urgente"></label>
        <label class="campo"><span>Descrição</span><textarea id="tf-desc" maxlength="5000">${esc(t.descricao || '')}</textarea></label>
        <div><div class="rotulo-mini" style="margin-bottom:4px">Checklist</div><div id="tf-check"></div><div class="nova-tarefa" style="margin-top:6px"><input id="tf-novo-item" maxlength="200" placeholder="+ Item do checklist"></div></div>
        <div><div class="rotulo-mini" style="margin-bottom:4px">Horas nesta tarefa</div><div id="tf-horas" class="mudo" style="font-size:14px">Carregando…</div></div>
        <div class="erro-campo"></div></form>`,
      rodape: rodapeForm(`<div class="linha-botoes"><button type="button" class="botao primario" data-x="play">${ic('play')}Cronometrar</button><button type="button" class="botao" data-x="arquivar">${t.arquivada ? 'Desarquivar' : 'Arquivar'}</button><button type="button" class="botao perigo" data-x="excluir">Excluir</button></div>`),
      aoMontar: (v) => {
        const desenharCheck = () => {
          const tt = C().tarefaMap.get(id) || t;
          const itens = Object.entries(tt.checklist || {}).map(([k, x]) => ({ ...x, k })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
          $('#tf-check', v).innerHTML = itens.length ? itens.map((x) => `<div class="check-item${x.feito ? ' feito' : ''}"><input type="checkbox" data-ck="${esc(x.k)}"${x.feito ? ' checked' : ''} aria-label="Concluir ${esc(x.texto)}"><span>${esc(x.texto)}</span><button type="button" class="icone-botao" data-ck-rem="${esc(x.k)}" aria-label="Remover item">${ic('x')}</button></div>`).join('') : '<p class="mudo" style="font-size:13.5px">Sem itens.</p>';
        };
        desenharCheck();
        const parar = D.ouvir(() => { if (v.isConnected) setTimeout(desenharCheck, 0); else parar(); });
        v.addEventListener('change', async (ev) => { const ck = ev.target.dataset && ev.target.dataset.ck; if (ck) await exec(() => D.gravarCampos('tarefas', id, [[['checklist', ck, 'feito'], ev.target.checked]])); });
        v.addEventListener('click', async (ev) => { const r = ev.target.closest('[data-ck-rem]'); if (r) await exec(() => D.gravarCampos('tarefas', id, [[['checklist', r.dataset.ckRem], D.APAGAR]])); });
        $('#tf-novo-item', v).addEventListener('keydown', async (ev) => {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          const texto = ev.target.value.trim(); if (!texto) return;
          const n = Object.keys((C().tarefaMap.get(id) || t).checklist || {}).length;
          if (n >= N.LIMITES.checklist) { toast('Limite de 100 itens no checklist.', { tipo: 'erro' }); return; }
          ev.target.value = '';
          await exec(() => D.gravarCampos('tarefas', id, [[['checklist', D.novoId('ck')], { texto: N.validar.texto(texto, 200, 'Item'), feito: false, ordem: Date.now() }]]));

  // ====================================================================
  // SEMANA (folha de horas)

  function garantirPeriodo(de, ate) {
    const janela = N.addDias(N.hoje(), -60);
    if (de >= janela) return true;
    const k = `${de}|${ate}`;
    if (S.carregados.has(k)) return true;
    S.carregados.add(k);
    D.carregarPeriodo(de, ate).catch((e) => { S.carregados.delete(k); toast('Não foi possível carregar o período: ' + D.mensagemErro(e), { tipo: 'erro' }); });
    return false;
  }
  function vSemana() {
    const c = C();
    const dias = N.diasDaSemana(S.semana, c.cfg.inicioSemana);
    garantirPeriodo(dias[0], dias[6]);
    const folha = N.folha(c.entradas.filter(c.daArea), dias);
    const linhas = [...folha.values()];
    for (const k of S.linhasExtras) if (!folha.has(k)) { const [areaId, quadroId, tarefaId] = k.split('|'); if (!S.areaSel || areaId === S.areaSel) linhas.push({ chave: k, areaId, quadroId: quadroId || null, tarefaId: tarefaId || null, dias: {} }); }
    linhas.sort((a, b) => nomeArea(c, a.areaId).localeCompare(nomeArea(c, b.areaId)) || a.chave.localeCompare(b.chave));
    window.__linhasFolha = linhas;
    const totDia = dias.map((d) => linhas.reduce((t, l) => t + ((l.dias[d] || {}).segundos || 0), 0));
    const totSemana = totDia.reduce((a, b) => a + b, 0);
    let h = `<div class="linha-botoes" style="justify-content:space-between"><div class="linha-botoes"><button type="button" class="icone-botao" data-acao="semana" data-n="-7" aria-label="Semana anterior">${ic('esq')}</button><strong>${N.dataCurta(dias[0])} – ${N.dataCurta(dias[6])}</strong><button type="button" class="icone-botao" data-acao="semana" data-n="7" aria-label="Próxima semana">${ic('dir')}</button>${!dias.includes(c.hoje) ? '<button type="button" class="botao fantasma peq" data-acao="semana" data-n="0">Esta semana</button>' : ''}</div>
      <div class="linha-botoes"><button type="button" class="botao peq" data-acao="linha-folha">${ic('mais')}Linha</button><button type="button" class="botao peq" data-acao="lancar">${ic('mais')}Lançar com horário</button></div></div>`;
    if (c.cfg.metaSemanaS) h += `<section class="cartao" style="padding:12px 16px"><div class="cartao-cab" style="margin-bottom:6px"><h2 style="font-size:15px">Meta da semana</h2><small><span class="num">${N.fmtDuracao(totSemana)}</span> de ${N.fmtDuracao(c.cfg.metaSemanaS)}</small></div><div class="barra"><i style="width:${Math.min(100, (totSemana / c.cfg.metaSemanaS) * 100)}%"></i></div></section>`;
    h += `<div class="folha-wrap"><table class="folha"><thead><tr><th class="rot">Projeto</th>${dias.map((d) => `<th class="${d === c.hoje ? 'hoje' : ''}">${N.DIAS[N.diaSemana(d)]} ${Number(d.slice(8))}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
    if (!linhas.length) h += `<tr><td class="rot" colspan="9"><div class="vazio" style="text-align:left;align-items:flex-start"><strong>Nada nesta semana</strong><span>Toque em "+ Linha" para escolher o projeto e digite as horas de cada dia (ex.: 2:30).</span></div></td></tr>`;
    linhas.forEach((l, i) => {
      const q = l.quadroId && c.quadroMap.get(l.quadroId), t = l.tarefaId && c.tarefaMap.get(l.tarefaId);
      const tot = dias.reduce((s, d) => s + ((l.dias[d] || {}).segundos || 0), 0);
      h += `<tr><td class="rot"><strong>${esc(t ? t.titulo : q ? q.nome : nomeArea(c, l.areaId))}</strong><small>${esc(q ? [nomeArea(c, l.areaId), t ? q.nome : null].filter(Boolean).join(' · ') : ((c.areaMap.get(l.areaId) || {}).cliente || ''))}</small></td>${dias.map((d, j) => {

  async function salvarCelula(input) {

  // ====================================================================
  // RELATÓRIOS
  // ====================================================================
  function periodoRel(c) {
    const r = S.rel;
    const ini = N.inicioSemana(c.hoje, c.cfg.inicioSemana);
    if (r.periodo === 'semana') return [ini, N.addDias(ini, 6)];
    if (r.periodo === 'semana-passada') return [N.addDias(ini, -7), N.addDias(ini, -1)];
    if (r.periodo === 'mes') return [N.inicioMes(c.hoje), N.fimMes(c.hoje)];
    if (r.periodo === 'mes-passado') { const m = N.addDias(N.inicioMes(c.hoje), -1); return [N.inicioMes(m), N.fimMes(m)]; }
    return [N.dataValida(r.de) ? r.de : N.addDias(c.hoje, -29), N.dataValida(r.ate) ? r.ate : c.hoje];
  }
  function filtroRel(c) {
    const r = S.rel;
    return (e) => {
      const a = c.areaMap.get(e.areaId);
      if (a && a.modulos && a.modulos.relatorios === false) return false;
      if (r.areaId && e.areaId !== r.areaId) return false;
      if (r.quadroId && e.quadroId !== r.quadroId) return false;
      if (r.fat === 'sim' && !e.faturavel) return false;
      if (r.fat === 'nao' && e.faturavel) return false;
      if (!r.arquivados) { const q = e.quadroId && c.quadroMap.get(e.quadroId), t = e.tarefaId && c.tarefaMap.get(e.tarefaId); if ((a && a.arquivada) || (q && q.arquivado) || (t && t.arquivada)) return false; }
      return true;
    };
  }

  // ---------- gráfico de barras ----------
  function desenharGraficos() {
    for (const el of $$('[data-grafico="barras"]')) { const w = Math.floor(el.clientWidth); if (w) el.innerHTML = gBarras(w, el.dataset.de, el.dataset.ate); }
  }
  function gBarras(W, de, ate) {
    const rel = window.__rel;
    if (!rel) return '';
    const grupos = [];
    const g = S.rel.agrupar;
    const c = C();
    if (g === 'dia') for (let d = de; d <= ate; d = N.addDias(d, 1)) grupos.push({ rot: `${Number(d.slice(8))}`, tip: N.dataLonga(d), dias: [d] });
    else if (g === 'semana') { for (let d = N.inicioSemana(de, c.cfg.inicioSemana); d <= ate; d = N.addDias(d, 7)) grupos.push({ rot: N.dataCurta(d), tip: `Semana de ${N.dataCurta(d)}`, dias: Array.from({ length: 7 }, (_, i) => N.addDias(d, i)) }); }
    else { for (let d = N.inicioMes(de); d <= ate; d = N.addDias(N.fimMes(d), 1)) { const dias = []; for (let x = d; x <= N.fimMes(d); x = N.addDias(x, 1)) dias.push(x); grupos.push({ rot: N.dataCurta(d).split(' ')[1], tip: `${N.dataCurta(d).split(' ')[1]}/${d.slice(0, 4)}`, dias }); } }
    for (const x of grupos) x.s = x.dias.reduce((t, d) => t + (rel.porDia.get(d) || 0), 0);
    const H = 200, L = 40, R = 6, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
    const maxH = Math.max(1, ...grupos.map((x) => x.s / 3600));
    const passo = maxH <= 4 ? 1 : maxH <= 10 ? 2 : maxH <= 25 ? 5 : maxH <= 60 ? 10 : 20;
    const topo = Math.ceil(maxH / passo) * passo;
    const y = (h) => T + ph - (h / topo) * ph;
    const banda = pw / Math.max(1, grupos.length);
    const bw = Math.max(3, Math.min(28, banda * 0.6));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Horas por período">`;
    for (let v = 0; v <= topo; v += passo) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}h</text>`;
    grupos.forEach((x, i) => {
      const cx = L + banda * i + banda / 2, hh = x.s / 3600;
      if (hh > 0) { const top = y(hh), r = Math.min(4, bw / 2, y(0) - top); s += `<path d="M${cx - bw / 2},${y(0)}V${top + r}Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top}H${cx + bw / 2 - r}Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r}V${y(0)}Z" fill="var(--accent)"/>`; }
      if (grupos.length <= 16 || i % Math.ceil(grupos.length / 12) === 0) s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${esc(x.rot)}</text>`;
      s += `<rect x="${L + banda * i}" y="${T}" width="${banda}" height="${ph}" fill="transparent" data-tip="${esc(`${x.tip}\n${N.fmtDuracao(x.s)}`)}"/>`;
    });
    return s + '</svg>';
  }

    const tema = pref.ler('tema', 'auto');
    h += `<section class="cartao"><div class="cartao-cab"><h2>Metas e semana</h2><button type="button" class="botao peq" data-acao="config">Editar</button></div>
      <p class="mudo" style="font-size:14px">Meta diária: ${cfg.metaDiaS ? N.fmtDuracao(cfg.metaDiaS) : 'não definida'} · Meta semanal: ${cfg.metaSemanaS ? N.fmtDuracao(cfg.metaSemanaS) : 'não definida'} · A semana começa ${cfg.inicioSemana === 0 ? 'no domingo' : 'na segunda'}</p></section>
      <section class="cartao"><div class="cartao-cab"><h2>Conta e aparência</h2></div>${chipUsuario()}
        <fieldset class="campo" style="margin-top:12px"><legend>Tema</legend><div class="chips">${[['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([k, t]) => `<label class="chip"><input type="radio" name="tema" value="${k}"${tema === k ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>
        <p class="mudo" style="font-size:12.5px;margin-top:8px">Os horários são guardados com o fuso do aparelho no momento do registro (${esc(N.fusoLocal())}). Se você viajar, os dias dos registros antigos não mudam.</p></section>
      <section class="cartao"><div class="cartao-cab"><h2>Backup e dados</h2></div>
        <div class="linha-botoes"><button type="button" class="botao" data-acao="exportar">Exportar backup (arquivo)</button><label class="botao" style="position:relative">Importar backup<input type="file" id="importar" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><button type="button" class="botao" data-acao="backup-agora">Backup na nuvem agora</button></div>
        <div class="aviso neutro" style="margin-top:12px;font-size:13.5px">O <b>backup automático</b> é diário (quando algo mudou) e fica <b>na nuvem, na sua área privada</b>; ficam os 7 últimos e dá para restaurar aqui. Ele protege contra exclusões e importações erradas, mas não contra a perda da conta. Para isso, use <b>Exportar backup</b> de vez em quando e guarde o arquivo.</div>
        <div class="rotulo-mini" style="margin:12px 0 4px">Backups na nuvem</div>
        ${D.listaBackups().length ? D.listaBackups().map((b) => `<div class="linha-lista"><div class="esq"><div><strong>${quando(b.criadoEm)}</strong><small>${esc(b.motivo)}${b.contagem ? ` · ${b.contagem.entradas || 0} registros · ${b.contagem.tarefas || 0} tarefas` : ''}</small></div></div><div class="dir"><button type="button" class="botao peq" data-acao="restaurar" data-id="${esc(b.id)}">Restaurar</button></div></div>`).join('') : '<p class="mudo" style="font-size:14px">Nenhum ainda.</p>'}</section>
      <section class="cartao" style="border-color:color-mix(in srgb,var(--bad) 35%,var(--line))"><div class="cartao-cab"><h2>Apagar meus dados</h2></div><p class="mudo" style="font-size:14px;margin-bottom:10px">Remove áreas, quadros, tarefas e horas. Um backup na nuvem é feito antes.</p><button type="button" class="botao perigo" data-acao="apagar-tudo">Apagar todos os meus dados</button></section>`;
    return h;
  }
  function editarArea(a) {
    abrirModal({
      titulo: a ? 'Editar área' : 'Nova área', largo: true,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:14px">${camposArea(a || {})}${a ? '<div class="aviso neutro" style="font-size:13px">Mudar moeda ou valor por hora vale só para registros novos. Os antigos mantêm a tarifa da época.</div>' : ''}<div class="erro-campo"></div></form>`,
      rodape: rodapeForm(a ? `<div class="linha-botoes"><button type="button" class="botao" data-x="arquivar">${a.arquivada ? 'Reativar' : 'Arquivar'}</button><button type="button" class="botao perigo" data-x="excluir">Excluir</button></div>` : ''),
      aoMontar: (v) => {
        const b = (x) => v.querySelector(`[data-x=${x}]`);
        if (b('arquivar')) b('arquivar').onclick = async () => { if (await exec(() => D.gravarCampos('areas', a.id, [[['arquivada'], !a.arquivada]]), a.arquivada ? 'Área reativada' : 'Área arquivada (as horas continuam nos relatórios)')) fecharModal(v); };
        if (b('excluir')) b('excluir').onclick = async () => {
          if (!(await confirmar({ titulo: 'Excluir área?', texto: `“${esc(a.nome)}” será excluída de vez.`, botao: 'Excluir', perigo: true }))) return;
          try { await Sv.excluirOuArquivar('areas', a.id); fecharModal(v); toast('Área excluída'); } catch (e) { toast(D.mensagemErro(e), { tipo: 'erro', ms: 7000 }); }
        };
        ligarEnvio(v, async () => {
          const d = lerArea(v, a);
          await D.salvarDoc('areas', d);
          if (!a && d.modulos.quadros) await D.salvarDoc('quadros', novoQuadro(d.id, 'Quadro principal'));
          toast(a ? 'Área salva' : 'Área criada');
          return true;
        });
      },
    });
  }
  function editarConfig() {
    const cfg = C().cfg;
    abrirModal({
      titulo: 'Metas e semana',
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:12px"><div class="campos"><label class="campo"><span>Meta diária</span><input id="cf-dia" placeholder="ex.: 6h" value="${cfg.metaDiaS ? N.fmtDuracao(cfg.metaDiaS) : ''}"></label><label class="campo"><span>Meta semanal</span><input id="cf-semana" placeholder="ex.: 30h" value="${cfg.metaSemanaS ? N.fmtDuracao(cfg.metaSemanaS) : ''}"></label>
        <label class="campo"><span>A semana começa</span><select id="cf-ini">${opt(1, 'Na segunda', cfg.inicioSemana !== 0)}${opt(0, 'No domingo', cfg.inicioSemana === 0)}</select></label></div><div class="erro-campo"></div></form>`,
      rodape: rodapeForm(),
      aoMontar: (v) => ligarEnvio(v, async () => {
        const ler = (id) => { const t = val(v, id); if (!t) return null; const s = N.lerDuracao(t); if (!Number.isFinite(s)) throw Object.assign(new Error('Meta inválida. Ex.: 6h ou 7:30'), { code: 'invalid-argument' }); return s; };
        await D.salvarDoc('config', { id: 'eu', metaDiaS: ler('#cf-dia'), metaSemanaS: ler('#cf-semana'), inicioSemana: Number(val(v, '#cf-ini')) });
        toast('Ajustes salvos');
        return true;
      }),
    });
  }
  function baixar(nome, conteudo, tipo) {
    try {
      const url = URL.createObjectURL(new Blob([conteudo], { type: tipo || 'application/json;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = nome; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast('Arquivo baixado: ' + nome);
    } catch (e) { toast('Não foi possível baixar: ' + e.message, { tipo: 'erro' }); }
  }
  function oferecerSubstituicao(v, origem) {
    if (!v.ok) return abrirModal({ titulo: 'Este arquivo não pode ser usado', fecharNoVeu: true, corpo: `<div class="aviso perigo">${v.erros.map(esc).join('<br>')}${v.totalErros > (v.erros || []).length ? `<br>e mais ${v.totalErros - v.erros.length}` : ''}</div><p class="mudo">Nada foi alterado.</p>`, rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Entendi</button></div>' });
    const ct = v.contagem;
    confirmar({
      titulo: origem === 'nuvem' ? 'Restaurar este backup?' : 'Importar este backup?', botao: 'Substituir meus dados', perigo: true,
      texto: `Seus dados atuais serão <b>substituídos</b> por: ${ct.areas} áreas, ${ct.quadros} quadros, ${ct.tarefas} tarefas, ${ct.entradas} registros de horas e ${ct.recebimentos} recebimentos.`,
      extra: '<div class="aviso" style="margin-top:10px">Antes, um backup dos dados atuais é guardado na nuvem.</div>',
    }).then(async (ok) => {
      if (!ok) return;
      const t = toast('Substituindo…', { ms: 600000 });
      try { await D.substituirTudo(v.dados, (f, tot) => { t.firstChild.textContent = `Substituindo… ${f} de ${tot}`; }); t.remove(); toast('Dados substituídos'); }
      catch (e) { t.remove(); toast('Parou no meio: ' + D.mensagemErro(e) + ' Restaure pelo backup mais recente.', { tipo: 'erro', ms: 12000 }); }
    });
  }
  async function sair() {
    if (!(await confirmar({ titulo: 'Sair da conta?', texto: 'Seus dados continuam na nuvem. Os dados guardados neste aparelho serão apagados.', botao: 'Sair' }))) return;
    try {
      let ok = await D.sair();
      if (!ok) {
        if (!(await confirmar({ titulo: 'Há registros ainda não enviados', texto: 'Alguns registros feitos sem internet ainda não chegaram à nuvem. Se sair agora, eles se perdem.', botao: 'Sair mesmo assim', perigo: true, cancelar: 'Esperar' }))) return;
        ok = await D.sair({ forcar: true });
      }
      setTimeout(() => location.reload(), 150);
    } catch (e) { toast('Não foi possível sair: ' + D.mensagemErro(e), { tipo: 'erro' }); }
  }

  const VISOES = { cronometro: vCronometro, quadros: vQuadros, semana: vSemana, relatorios: vRelatorios, areas: vAreas };

  // ====================================================================
  // AÇÕES
  // ====================================================================
  function irPara(aba) { S.aba = aba; pref.gravar('aba', aba); window.scrollTo(0, 0); render(); }
  const ACOES = {
    aba: (d) => irPara(d.aba), entrar: async () => { try { await D.entrar(); } catch (e) { D.erroLogin = D.mensagemErro(e); render(); } },
    sair, recarregar: () => location.reload(),
    'copiar-link': async () => { const url = location.origin + location.pathname; try { await navigator.clipboard.writeText(url); toast('Link copiado. Cole no Safari ou no Chrome.'); } catch (e) { toast(url, { ms: 10000 }); } },
    pausar: (d) => exec(() => Sv.pausar(d.id)), retomar: (d) => exec(() => Sv.retomar(d.id)), parar: (d) => pararSessao(d.id),
    descartar: async (d) => { if (await confirmar({ titulo: 'Descartar o cronômetro?', texto: 'O tempo contado não será registrado.', botao: 'Descartar', perigo: true })) exec(() => Sv.descartar(d.id), 'Cronômetro descartado'); },
    'corrigir-inicio': (d) => modalCorrigirInicio(d.id), 'editar-ativo': (d) => modalEditarAtivo(d.id), 'resolver-conflito': modalConflito,
    'iniciar-recente': (d) => { const x = (window.__recentes || [])[Number(d.i)]; if (x) iniciarCom(x); },
    continuar: (d) => { const e = D.estado.entradas.get(d.id); if (e) iniciarCom({ areaId: e.areaId, quadroId: e.quadroId, tarefaId: e.tarefaId, descricao: e.descricao, faturavel: e.faturavel }); },
    lancar: () => editarEntrada(null), 'editar-entrada': (d) => { const e = D.estado.entradas.get(d.id); if (e) editarEntrada(e); },
    'area-quadros': (d) => { S.areaSel = d.id; pref.gravar('areaSel', S.areaSel); render(); },
    'escolher-quadro': (d) => { S.quadroPorArea[d.area] = d.id; pref.gravar('quadroPorArea', S.quadroPorArea); render(); },
    'novo-quadro': (d) => editarQuadro(null, d.area), 'editar-quadro': (d) => editarQuadro(C().quadroMap.get(d.id)),
    vista: (d) => { S.vista = d.v; pref.gravar('vista', S.vista); render(); },
    'abrir-tarefa': (d) => abrirTarefa(d.id), 'cronometrar-tarefa': (d) => cronometrarTarefa(d.id),
    semana: (d) => { S.semana = Number(d.n) === 0 ? N.hoje() : N.addDias(S.semana, Number(d.n)); render(); }, 'linha-folha': modalLinhaFolha,
    'rel-periodo': (d) => { S.rel.periodo = d.p; render(); }, 'rel-agrupar': (d) => { S.rel.agrupar = d.g; render(); },
    simular: modalSimulacao, recebimento: (d) => modalRecebimento(d.id), csv: exportarCsv, 'copiar-dias': copiarDias,
    'nova-area': () => editarArea(null), 'editar-area': (d) => editarArea(C().areaMap.get(d.id)), 'ver-arquivadas': () => { S.verArquivadas = !S.verArquivadas; render(); },
    config: editarConfig,
    'falha-tentar': (d) => { const f = D.falhas[Number(d.i)]; if (f) exec(() => D.tentarDeNovo(f), 'Enviado de novo'); },
    'falha-descartar': (d) => { const f = D.falhas[Number(d.i)]; if (f) D.descartarFalha(f.col, f.id); },
    exportar: async () => { const t = toast('Preparando o arquivo…', { ms: 60000 }); try { const dados = await D.lerTudo(); t.remove(); baixar(`expediente-backup-${N.hoje()}.json`, JSON.stringify(N.montarBackup(dados, agoraIso()), null, 1)); } catch (e) { t.remove(); toast('Não foi possível exportar: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    'backup-agora': async () => { const t = toast('Fazendo backup…', { ms: 60000 }); try { await D.criarBackup('manual'); t.remove(); toast('Backup feito na nuvem'); } catch (e) { t.remove(); toast('Backup não foi feito: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    restaurar: async (d) => { const b = D.estado.backups.find((x) => x.id === d.id); if (!b) return; try { oferecerSubstituicao(N.validarBackup(await D.lerBackup(b)), 'nuvem'); } catch (e) { toast('Não foi possível ler o backup: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    'apagar-tudo': () => abrirModal({
      titulo: 'Apagar todos os seus dados?', corpo: `<p style="color:var(--ink-2)">Áreas, quadros, tarefas, horas e recebimentos serão removidos. Um backup na nuvem é feito antes.</p><label class="campo"><span>Digite APAGAR para confirmar</span><input id="ap-conf" autocomplete="off" autofocus></label><div class="erro-campo"></div>`,
      rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Cancelar</button><button type="button" class="botao perigo cheio" data-salvar>Apagar tudo</button></div>',
      aoMontar: (v) => ligarEnvio(v, async () => { if (val(v, '#ap-conf').toUpperCase() !== 'APAGAR') return 'Digite APAGAR para confirmar.'; await D.substituirTudo(Object.fromEntries(N.COLECOES.map((c) => [c, []]))); toast('Dados apagados. O backup está em Áreas.'); return true; }),
    }),
  };
  document.addEventListener('click', (e) => {
    const s = e.target.closest('#sync.erro'); if (s) { irPara('areas'); return; }
    const a = e.target.closest('[data-acao]');
    if (!a || a.disabled) return;
    const fn = ACOES[a.dataset.acao];
    if (fn) { e.preventDefault(); e.stopPropagation(); fn(a.dataset, a); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-acao]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.folha) { e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'form-iniciar') {
      e.preventDefault();
      const f = e.target;
      const g = (id) => ($('#' + id, f) || {}).value || null;
      const qHidden = $('#in-q-c', f).hidden;
      iniciarCom({ areaId: g('in-area'), quadroId: qHidden ? null : g('in-quadro'), tarefaId: qHidden ? null : g('in-tarefa'), descricao: ($('#in-desc', f).value || '').trim(), faturavel: $('#in-fat', f).checked });
    }
    const nova = e.target.closest && e.target.closest('form[data-nova]');
    if (nova) { e.preventDefault(); const i = $('input', nova); const t = i.value.trim(); if (t) { i.value = ''; criarTarefa($('#kanban').dataset.quadro, nova.dataset.nova, t); } }
  });
  // ligação dinâmica dos campos do formulário de início (renderizado a cada redesenho)
  const observador = new MutationObserver(() => { const f = $('#form-iniciar'); if (f && !f._ligado) { f._ligado = true; ligarVinculo(f, 'in', S.form, (a) => { const fat = $('#in-fat', f); if (fat && a && S.form.areaId !== a.id) fat.checked = a.faturavelPadrao !== false; }); } });
  observador.observe($('#conteudo'), { childList: true, subtree: false });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'seletor-area') { S.areaSel = t.value; pref.gravar('areaSel', S.areaSel); S.rel.areaId = t.value; S.rel.quadroId = ''; render(); return; }
    if (t.dataset && t.dataset.folha) { salvarCelula(t); return; }
    if (t.closest && t.closest('#form-iniciar')) { const f = $('#form-iniciar'); S.form = { ...S.form, areaId: ($('#in-area', f) || {}).value, quadroId: ($('#in-quadro', f) || {}).value, tarefaId: ($('#in-tarefa', f) || {}).value }; pref.gravar('form', S.form); return; }
    const r = S.rel;
    const mapa = { 'rl-de': () => { r.de = t.value; }, 'rl-ate': () => { r.ate = t.value; }, 'rl-area': () => { r.areaId = t.value; r.quadroId = ''; }, 'rl-quadro': () => { r.quadroId = t.value; }, 'rl-fat': () => { r.fat = t.value; }, 'rl-arq': () => { r.arquivados = t.checked; },
      'rl-am': () => { r.arred.modo = t.value; pref.gravar('arred', r.arred); }, 'rl-ap': () => { r.arred.passo = Number(t.value); pref.gravar('arred', r.arred); }, 'rl-ad': () => { r.arred.direcao = t.value; pref.gravar('arred', r.arred); },
      'ls-coluna': () => { S.lista.coluna = t.value; }, 'ls-prio': () => { S.lista.prioridade = t.value; }, 'ls-prazo': () => { S.lista.prazo = t.value; } };
    if (mapa[t.id]) { mapa[t.id](); render(); return; }
    if (t.name === 'tema') { pref.gravar('tema', t.value); aplicarTema(); }
    if (t.id === 'importar') {
      const arq = t.files && t.files[0]; t.value = '';
      if (!arq) return;
      const rd = new FileReader();
      rd.onload = () => { let obj; try { obj = JSON.parse(String(rd.result)); } catch (err) { oferecerSubstituicao({ ok: false, erros: ['O arquivo não é um JSON válido.'] }); return; } oferecerSubstituicao(N.validarBackup(obj), 'arquivo'); };
      rd.readAsText(arq);
    }
  });
  let tBusca = null;
  document.addEventListener('input', (e) => { if (e.target.id === 'ls-busca') { S.lista.busca = e.target.value; clearTimeout(tBusca); tBusca = setTimeout(render, 160); } });
  document.addEventListener('focusin', (e) => { if (e.target.dataset && e.target.dataset.folha && e.target.readOnly) { const l = (window.__linhasFolha || [])[Number(e.target.dataset.folha)]; e.target.blur(); if (l) abrirCelula(l, e.target.dataset.dia); } });
  function aplicarTema() {
    const t = pref.ler('tema', 'auto');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    setTimeout(desenharGraficos, 0);
  }

  // ====================================================================
  // INÍCIO
  // ====================================================================
  $('#marca-selo').innerHTML = ic('relogio');
  aplicarTema();
  render();
  let backupFeito = false, tCarga = null;
  D.ouvir(() => {
    _c = null;
    if (S.status === 'carregando' && D.usuario && D.erroInicial) S.status = 'erro';
    if (S.status === 'carregando' && D.usuario && D.pronto) S.status = D.estado.areas.length ? 'ok' : 'primeira';
    if (S.status === 'primeira' && D.estado.areas.length) S.status = 'ok';
    if (S.status === 'ok' && D.pronto && !D.estado.areas.length) S.status = 'primeira';
    render();
    if (D.pronto && S.status === 'ok' && !backupFeito) { backupFeito = true; setTimeout(() => D.backupDiario().catch((e) => console.warn('backup diário', e)), 5000); }
  });
  D.ouvirConta((u) => {
    backupFeito = false; _c = null; clearTimeout(tCarga);
    pilha.slice().forEach((v) => fecharModal(v));
    if (!u) { S.status = 'login'; render(); return; }
    S.status = 'carregando'; render();
    tCarga = setTimeout(() => { if (S.status === 'carregando') { S.status = D.estado.areas.length ? 'ok' : 'primeira'; render(); } }, 9000);
  });
  D.aoErroTardio = (e) => toast('Uma gravação feita sem internet foi recusada: ' + D.mensagemErro(e) + ' Veja em Áreas → Precisa de atenção.', { tipo: 'erro', ms: 10000 });
  addEventListener('online', () => { renderTopo(); toast('Conexão de volta. Sincronizando.'); });
  addEventListener('offline', () => { renderTopo(); toast('Sem internet. Continue trabalhando: o cronômetro e os registros ficam no aparelho e sobem depois.', { ms: 6000 }); });
  try { if (!D.iniciar(window.firebase, window.FIREBASE_CONFIG)) { S.status = 'sem-config'; render(); } } catch (e) { console.error(e); D.erroInicial = D.mensagemErro(e); S.status = 'erro'; render(); }
  if (!window.__DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
